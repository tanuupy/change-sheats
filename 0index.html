    close.onclick=()=>overlay.classList.remove('show');
    use.onclick=()=>{
      if(selected<0 || !list[selected]) return;
      const item=list[selected];

      used=Array.isArray(item.used)?item.used.slice():Array(TOTAL).fill(true);
      target=Array.isArray(item.target)?item.target.slice():used.map(Boolean);
      placed=Array.isArray(item.placed)?item.placed.slice():Array(TOTAL).fill('');
      roster=Array.isArray(item.roster)?item.roster.slice():[];
      window.memberLabels={...(item.memberLabels||{})};
      history=[];

      document.getElementById('setup')?.classList.add('hide');
      document.getElementById('rosterScreen')?.classList.add('hide');
      document.getElementById('work')?.classList.remove('hide');

      overlay.classList.remove('show');
      renderSeats();
      updateStatus();

      if(typeof flashStatus==='function') flashStatus('保存した座席を呼び出しました','good');
    };

    overlay.classList.add('show');
  }

  // Hook whichever saved-list button exists in the current layout.
  ['openSavedV101','openSavedV10','openSavedBrowser'].forEach(id=>{
    const old=$(id);
    if(!old) return;
    const n=old.cloneNode(true);
    old.replaceWith(n);
    n.addEventListener('click',openSaved);
  });
})();
</script>


<script>
(function(){
  function sequentialRosterForUsedSeats(){
    const count = Array.isArray(used) ? used.filter(Boolean).length : 0;
    return Array.from({length:count},(_,i)=>String(i+1));
  }

  const go=document.getElementById('goWork');
  if(go){
    go.addEventListener('click',function(){
      setTimeout(function(){
        const count=used.filter(Boolean).length;

        // Only rebuild automatically when the current roster is the normal
        // sequential/default roster. Custom names/numbers are preserved.
        const current=Array.isArray(roster)?roster.map(String):[];
        const looksDefault=current.every((v,i)=>v===String(i+1));

        if(!current.length || looksDefault || current.length!==count){
          const oldLabels={...(window.memberLabels||{})};
          roster=sequentialRosterForUsedSeats();

          // Preserve names already registered for existing numbers.
          const nextLabels={};
          roster.forEach(id=>{
            nextLabels[id]=oldLabels[id] || id;
          });
          window.memberLabels=nextLabels;

          if(typeof renderRoster2==='function') renderRoster2();
          if(typeof updateRosterCount==='function') updateRosterCount();
        }
      },0);
    },true);
  }
})();
</script>


<script>
(function(){
  const NAME_KEY='seatSavedNamesV2';
  const $=id=>document.getElementById(id);

  function readSavedNames(){
    try{
      const v=JSON.parse(localStorage.getItem(NAME_KEY)||'{}');
      return v && typeof v==='object' ? v : {};
    }catch(e){ return {}; }
  }

  function writeSavedNames(map){
    localStorage.setItem(NAME_KEY,JSON.stringify(map||{}));
  }

  function saveNamesFromRows(){
    const saved=readSavedNames();
    document.querySelectorAll('#memberRows2 .memberRow').forEach(row=>{
      const ins=row.querySelectorAll('input');
      const id=(ins[0]?.value||'').trim();
      const label=(ins[1]?.value||'').trim();
      if(id) saved[id]=label||id;
    });
    writeSavedNames(saved);
    window.memberLabels={...saved,...(window.memberLabels||{})};
  }

  function applySavedNamesToRows(){
    const saved=readSavedNames();
    document.querySelectorAll('#memberRows2 .memberRow').forEach(row=>{
      const ins=row.querySelectorAll('input');
      const id=(ins[0]?.value||'').trim();
      if(id && ins[1] && saved[id]) ins[1].value=saved[id];
    });
  }

  function refreshRosterChipsWithNames(){
    const saved=readSavedNames();
    const chips=[...document.querySelectorAll('#rosterNums2 .numChip')];
    chips.forEach((chip,i)=>{
      const id=(Array.isArray(roster)&&roster[i]!=null)?String(roster[i]):String(i+1);
      const name=(window.memberLabels&&window.memberLabels[id]) || saved[id];
      chip.textContent=name && name!==id ? name : id;
      chip.title=name && name!==id ? `${id}：${name}` : id;
    });
  }

  // Restore saved names whenever roster screen opens or editor is expanded.
  document.addEventListener('click',e=>{
    if(e.target?.id==='goWork' || e.target?.id==='changeMembers2'){
      setTimeout(()=>{
        applySavedNamesToRows();
        const saved=readSavedNames();
        window.memberLabels={...saved,...(window.memberLabels||{})};
        refreshRosterChipsWithNames();
      },60);
    }
  });

  document.addEventListener('input',e=>{
    if(e.target.closest?.('#memberRows2')){
      saveNamesFromRows();
      setTimeout(refreshRosterChipsWithNames,0);
    }
  });

  const rosterNext=$('rosterNext2');
  if(rosterNext){
    rosterNext.addEventListener('click',()=>{
      saveNamesFromRows();
      const saved=readSavedNames();
      window.memberLabels={...saved,...(window.memberLabels||{})};
    },true);
  }

  // Initial restore
  setTimeout(()=>{
    const saved=readSavedNames();
    window.memberLabels={...saved,...(window.memberLabels||{})};
    applySavedNamesToRows();
    refreshRosterChipsWithNames();
  },100);

  // ----- cancellation token for ongoing animations/bulk draws -----
  window.__seatDrawRun = (window.__seatDrawRun||0);

  function cancelDraw(){
    window.__seatDrawRun++;
    document.querySelectorAll('.nameReveal,.nameFly,.nameFlight,.impactWave,.impactCore,.impactRay,.drawStage,.ticketFly').forEach(el=>el.remove());
  }
  window.cancelSeatDraw=cancelDraw;

  // Cancel if user navigates to another app screen.
  ['backSetup','rosterBack','goWork','rosterNext2'].forEach(id=>{
    const el=$(id);
    if(el) el.addEventListener('click',cancelDraw,true);
  });

  // New animation:
  // show large name/number, then THE SAME text moves from center to the desk.
  window.flyTicketToSeat = function(id,seatEl){
    const myRun=window.__seatDrawRun;
    return new Promise(resolve=>{
      const key=String(id);
      const saved=readSavedNames();
      const name=(window.memberLabels?.[key] || saved[key] || key);
      const display=String(name).trim() || key;

      const r=seatEl.getBoundingClientRect();
      const cx=r.left+r.width/2, cy=r.top+r.height/2;

      const fly=document.createElement('div');
      fly.className='nameFlight';
      fly.textContent=display;
      document.body.appendChild(fly);

      // Hold large briefly, then move that same element to the seat.
      setTimeout(()=>{
        if(myRun!==window.__seatDrawRun){ fly.remove(); resolve(false); return; }

        fly.style.left=`${cx}px`;
        fly.style.top=`${cy}px`;
        fly.style.transform='translate(-50%,-50%) scale(.34)';

        setTimeout(()=>{
          if(myRun!==window.__seatDrawRun){ fly.remove(); resolve(false); return; }

          const core=document.createElement('div');
          core.className='impactCore';
          core.style.left=`${cx}px`; core.style.top=`${cy}px`;
          document.body.appendChild(core);

          core.animate([
            {transform:'translate(-50%,-50%) scale(.15)',opacity:1},
            {transform:'translate(-50%,-50%) scale(1.8)',opacity:1},
            {transform:'translate(-50%,-50%) scale(3.1)',opacity:0}
          ],{duration:430,easing:'ease-out'});

          for(let i=0;i<3;i++){
            const wave=document.createElement('div');
            wave.className='impactWave';
            wave.style.left=`${cx}px`; wave.style.top=`${cy}px`;
            document.body.appendChild(wave);
            wave.animate([
              {transform:'translate(-50%,-50%) scale(.15)',opacity:1},
              {transform:`translate(-50%,-50%) scale(${3.2+i*1.4})`,opacity:0}
            ],{duration:520+i*90,delay:i*35,easing:'ease-out'});
            setTimeout(()=>wave.remove(),800);
          }

          seatEl.animate([
            {transform:'scale(1)'},
            {transform:'scale(1.23)'},
            {transform:'scale(.93)'},
            {transform:'scale(1.05)'},
            {transform:'scale(1)'}
          ],{duration:450,easing:'ease-out'});

          seatEl.animate([
            {boxShadow:'0 0 0 rgba(37,99,235,0)'},
            {boxShadow:'0 0 46px 18px rgba(37,99,235,.92)'},
            {boxShadow:'0 0 0 rgba(37,99,235,0)'}
          ],{duration:520});

          fly.style.opacity='0';
          setTimeout(()=>{
            fly.remove(); core.remove(); resolve(true);
          },160);
        },500);
      },650);
    });
  };
  window.flyToSeat = window.flyTicketToSeat;

  // Ensure bulk draw halts when cancelled mid-way.
  ['orderedRestV101','randomRestV101','autoRest'].forEach(id=>{
    const btn=$(id);
    if(!btn) return;
    const oldHandler=btn.onclick;
    if(!oldHandler) return;
    // Existing handlers remain; cancellation is enforced by animation promise
    // and navigation increments token. We disable button on navigation too.
  });

  // Capture navigation and stop any continuing loop by marking controls enabled.
  document.addEventListener('click',e=>{
    if(e.target.closest('#backSetup,#rosterBack')){
      cancelDraw();
      document.querySelectorAll('#orderedRestV101,#randomRestV101,#autoRest,#placeOne').forEach(b=>{
        if(b) b.disabled=false;
      });
    }
  },true);

  // Final wrappers for one/bulk buttons to stop committing seats if animation was cancelled.
  const one=$('placeOne');
  if(one){
    const n=one.cloneNode(true);
    one.replaceWith(n);
    n.onclick=async()=>{
      let val=($('oneNum')?.value||'').trim();
      if(!val) return typeof flashStatus==='function' ? flashStatus('番号を入力してください。','bad') : null;

      const saved=readSavedNames();
      // name input may resolve back to number
      for(const [id,label] of Object.entries({...saved,...(window.memberLabels||{})})){
        if(String(label).trim()===val) val=String(id);
      }
      if(!Array.isArray(roster)||!roster.map(String).includes(String(val))){
        $('oneNum').value='';
        return typeof flashStatus==='function' ? flashStatus('使用しない番号です。','bad') : null;
      }
      if(placed.some(x=>String(x)===String(val))){
        $('oneNum').value='';
        return typeof flashStatus==='function' ? flashStatus('この番号はすでに配置されています。','bad') : null;
      }

      let seats=[];
      for(let i=0;i<TOTAL;i++) if(used[i]&&target[i]&&!placed[i]) seats.push(i);
      if(!seats.length){
        $('oneNum').value='';
        return typeof flashStatus==='function' ? flashStatus('抽選対象の空席がありません。','bad') : null;
      }

      if(typeof violatesAny==='function'){
        const pref=seats.filter(i=>!violatesAny(val,i,placed));
        if(pref.length) seats=pref;
      }

      const idx=seats[Math.floor(Math.random()*seats.length)];
      const before=placed.slice();
      const run=++window.__seatDrawRun;
      $('oneNum').value='';
      n.disabled=true;

      const el=document.querySelectorAll('#seatGrid .desk')[idx];
      const ok=await window.flyTicketToSeat(String(val),el);

      if(ok && run===window.__seatDrawRun){
        history.push({snapshot:before});
        placed[idx]=String(val);
        renderSeats();
        updateStatus();
      }
      n.disabled=false;
    };
  }

  async function bulk(mode,btn){
    const run=++window.__seatDrawRun;
    const taken=new Set(placed.filter(Boolean).map(String));
    let nums=roster.map(String).filter(x=>!taken.has(x));
    let seats=[];
    for(let i=0;i<TOTAL;i++) if(used[i]&&target[i]&&!placed[i]) seats.push(i);

    if(!seats.length) return typeof flashStatus==='function' ? flashStatus('抽選対象の空席がありません。','bad') : null;
    if(nums.length<seats.length) return typeof flashStatus==='function' ? flashStatus(`残り ${nums.length}人 ／ 対象 ${seats.length}席`,'bad') : null;

    nums.sort((a,b)=>{
      const na=Number(a),nb=Number(b);
      if(Number.isFinite(na)&&Number.isFinite(nb)) return na-nb;
      return String(a).localeCompare(String(b),'ja');
    });
    nums=nums.slice(0,seats.length);

    // random destinations
    for(let i=seats.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [seats[i],seats[j]]=[seats[j],seats[i]];
    }
    if(mode==='random'){
      for(let i=nums.length-1;i>0;i--){
        const j=Math.floor(Math.random()*(i+1));
        [nums[i],nums[j]]=[nums[j],nums[i]];
      }
    }

    const before=placed.slice();
    btn.disabled=true;

    let didAny=false;
    for(let k=0;k<nums.length;k++){
      if(run!==window.__seatDrawRun) break;
      const idx=seats[k];
      const el=document.querySelectorAll('#seatGrid .desk')[idx];
      const ok=await window.flyTicketToSeat(nums[k],el);
      if(!ok || run!==window.__seatDrawRun) break;
      placed[idx]=nums[k];
      renderSeats();
      didAny=true;
    }

    if(didAny) history.push({snapshot:before});
    if(run===window.__seatDrawRun) updateStatus();
    btn.disabled=false;
  }

  const ordered=$('orderedRestV101');
  if(ordered){
    const n=ordered.cloneNode(true); ordered.replaceWith(n);
    n.onclick=()=>bulk('ordered',n);
  }
  const random=$('randomRestV101');
  if(random){
    const n=random.cloneNode(true); random.replaceWith(n);
    n.onclick=()=>bulk('random',n);
  }
})();
</script>

<script>
(function(){
  const KEY='seatConsiderPairsV3';
  const $=id=>document.getElementById(id);

  function loadPairs(){
    try{
      const v=JSON.parse(localStorage.getItem(KEY)||'[]');
      return Array.isArray(v)?v:[];
    }catch(e){ return []; }
  }

  let pairs=loadPairs();

  function savePairs(){
    // Preserve incomplete rows too, so pressing "add" never erases what was just selected.
    localStorage.setItem(KEY,JSON.stringify(pairs));
  }

  function memberOptions(){
    const rows=[...document.querySelectorAll('#memberRows2 .memberRow')];
    const out=[];
    rows.forEach(r=>{
      const ins=r.querySelectorAll('input');
      const id=(ins[0]?.value||'').trim();
      const label=(ins[1]?.value||'').trim();
      if(id) out.push({id,label:label||id});
    });

    if(!out.length && Array.isArray(roster)){
      const labels=window.memberLabels||{};
      roster.forEach(id=>{
        const key=String(id);
        out.push({id:key,label:labels[key]||key});
      });
    }
    return out;
  }

  function renderPairs(){
    const box=$('considerPairs2');
    if(!box) return;

    const members=memberOptions();
    box.innerHTML='';

    pairs.forEach((p,index)=>{
      const row=document.createElement('div');
      row.className='considerPairRow2';

      const a=document.createElement('select');
      const b=document.createElement('select');
      const sep=document.createElement('span');
      const del=document.createElement('button');

      sep.textContent='×';
      sep.style.textAlign='center';

      function fill(sel,value){
        sel.innerHTML='<option value="">選択</option>';
        members.forEach(m=>{
          const op=document.createElement('option');
          op.value=m.id;
          op.textContent=m.label;
          if(String(value||'')===String(m.id)) op.selected=true;
          sel.appendChild(op);
        });
      }

      fill(a,p.a);
      fill(b,p.b);

      a.addEventListener('change',()=>{
        pairs[index].a=a.value;
        savePairs();
      });
      b.addEventListener('change',()=>{
        pairs[index].b=b.value;
        savePairs();
      });

      del.type='button';
      del.textContent='×';
      del.addEventListener('click',()=>{
        pairs.splice(index,1);
        savePairs();
        renderPairs();
      });

      row.append(a,sep,b,del);
      box.appendChild(row);
    });

    if(!pairs.length){
      const empty=document.createElement('div');
      empty.style.cssText='font-size:10px;color:#94a3b8;padding:3px';
      empty.textContent='設定なし';
      box.appendChild(empty);
    }
  }

  const add=$('addConsiderPair2');
  if(add){
    // Replace previous handler completely so old code cannot filter unfinished pairs.
    const n=add.cloneNode(true);
    add.replaceWith(n);
    n.addEventListener('click',()=>{
      // First sync currently visible choices back into state.
      const rows=[...document.querySelectorAll('#considerPairs2 .considerPairRow2')];
      rows.forEach((r,i)=>{
        const sels=r.querySelectorAll('select');
        if(!pairs[i]) pairs[i]={a:'',b:''};
        pairs[i].a=sels[0]?.value||'';
        pairs[i].b=sels[1]?.value||'';
      });

      pairs.push({a:'',b:''});
      savePairs();
      renderPairs();
    });
  }

  // Keep pairs visible when member names are edited.
  document.addEventListener('input',e=>{
    if(e.target.closest?.('#memberRows2')){
      setTimeout(renderPairs,0);
    }
  });

  // Open hidden setting area reliably without losing state.
  const pref=$('hiddenPrefBtn');
  const panel=$('hiddenPrefPanel');
  if(pref && panel){
    const n=pref.cloneNode(true);
    pref.replaceWith(n);
    n.addEventListener('click',()=>{
      panel.style.display=panel.style.display==='none'?'block':'none';
      if(panel.style.display==='block') renderPairs();
    });
  }

  renderPairs();

  // Expose valid pairs to drawing logic; unfinished rows are simply ignored.
  window.getSeatConsiderPairs=function(){
    return pairs.filter(p=>p && p.a && p.b && p.a!==p.b).map(p=>({a:String(p.a),b:String(p.b)}));
  };
})();
</script>


<script>
(function(){
  const $=id=>document.getElementById(id);

  function getPairs(){
    if(typeof window.getSeatConsiderPairs==='function'){
      return window.getSeatConsiderPairs();
    }
    return [];
  }

  function adjacent(a,b){
    const ar=Math.floor(a/COLS), ac=a%COLS;
    const br=Math.floor(b/COLS), bc=b%COLS;
    return Math.abs(ar-br)+Math.abs(ac-bc)===1;
  }

  function allPairsValid(arr){
    const pairs=getPairs();
    for(const p of pairs){
      const ai=arr.findIndex(x=>String(x)===String(p.a));
      const bi=arr.findIndex(x=>String(x)===String(p.b));
      if(ai>=0 && bi>=0 && adjacent(ai,bi)) return false;
    }
    return true;
  }

  function shuffleCopy(a){
    const x=a.slice();
    for(let i=x.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [x[i],x[j]]=[x[j],x[i]];
    }
    return x;
  }

  // Build a complete arrangement first.
  // Strictly avoid all configured adjacency whenever at least one valid arrangement exists.
  function buildPlannedArrangement(nums,seats,basePlaced,randomizeNumberOrder){
    let numberOrder=nums.slice();
    if(randomizeNumberOrder) numberOrder=shuffleCopy(numberOrder);

    // Try many full-seat permutations before giving up.
    for(let attempt=0;attempt<5000;attempt++){
      const seatOrder=shuffleCopy(seats);
      const test=basePlaced.slice();
      numberOrder.forEach((n,k)=>test[seatOrder[k]]=n);
      if(allPairsValid(test)){
        return {nums:numberOrder.slice(), seats:seatOrder, strict:true};
      }
      // periodically reshuffle number order too for more search coverage
      if(randomizeNumberOrder && attempt%25===24){
        numberOrder=shuffleCopy(numberOrder);
      }
    }

    // Fallback: no valid global arrangement was found.
    // User explicitly asked to allow adjacency only when unavoidable.
    return {
      nums:numberOrder.slice(),
      seats:shuffleCopy(seats),
      strict:false
    };
  }

  async function plannedBulk(mode,btn){
    const run=++window.__seatDrawRun;

    const taken=new Set(placed.filter(Boolean).map(String));
    let nums=roster.map(String).filter(x=>!taken.has(String(x)));
    const seats=[];
    for(let i=0;i<TOTAL;i++){
      if(used[i] && target[i] && !placed[i]) seats.push(i);
    }

    if(!seats.length){
      return typeof flashStatus==='function' ? flashStatus('抽選対象の空席がありません。','bad') : null;
    }
    if(nums.length<seats.length){
      return typeof flashStatus==='function' ? flashStatus(`残り ${nums.length}人 ／ 対象 ${seats.length}席`,'bad') : null;
    }

    nums.sort((a,b)=>{
      const na=Number(a), nb=Number(b);
      if(Number.isFinite(na)&&Number.isFinite(nb)) return na-nb;
      return String(a).localeCompare(String(b),'ja');
    });
    nums=nums.slice(0,seats.length);

    const plan=buildPlannedArrangement(
      nums,
      seats,
      placed,
      mode==='random'
    );

    // Save whole pre-draw state for undo.
    const before=placed.slice();
    btn.disabled=true;

    // Important: assignment is already decided now.
    // We only REVEAL it one by one with animation.
    let any=false;
    for(let k=0;k<plan.nums.length;k++){
      if(run!==window.__seatDrawRun) break;

      const num=plan.nums[k];
      const idx=plan.seats[k];
      const el=document.querySelectorAll('#seatGrid .desk')[idx];

      const ok=await window.flyTicketToSeat(num,el);
      if(!ok || run!==window.__seatDrawRun) break;

      placed[idx]=num;
      renderSeats();
      any=true;
    }

    if(any) history.push({snapshot:before});
    btn.disabled=false;

    if(run===window.__seatDrawRun){
      updateStatus();
      if(typeof flashStatus==='function'){
        flashStatus(
          plan.strict
            ? '配慮条件を反映して配置しました'
            : '配置できる範囲で配慮して配置しました',
          'good'
        );
      }
    }
  }

  // Replace both bulk buttons with the new global-planning behavior.
  const ordered=$('orderedRestV101');
  if(ordered){
    const n=ordered.cloneNode(true);
    ordered.replaceWith(n);
    n.onclick=()=>plannedBulk('ordered',n);
  }

  const random=$('randomRestV101');
  if(random){
    const n=random.cloneNode(true);
    random.replaceWith(n);
    n.onclick=()=>plannedBulk('random',n);
  }

  // Also improve single draw:
  // only choose a violating seat when every currently available seat violates.
  const one=$('placeOne');
  if(one){
    const n=one.cloneNode(true);
    one.replaceWith(n);

    n.onclick=async()=>{
      let val=($('oneNum')?.value||'').trim();
      if(!val) return typeof flashStatus==='function' ? flashStatus('番号を入力してください。','bad') : null;

      const names=window.memberLabels||{};
      for(const [id,label] of Object.entries(names)){
        if(String(label).trim()===val) val=String(id);
      }

      if(!Array.isArray(roster)||!roster.map(String).includes(String(val))){
        $('oneNum').value='';
        return typeof flashStatus==='function' ? flashStatus('使用しない番号です。','bad') : null;
      }
      if(placed.some(x=>String(x)===String(val))){
        $('oneNum').value='';
        return typeof flashStatus==='function' ? flashStatus('この番号はすでに配置されています。','bad') : null;
      }

      let available=[];
      for(let i=0;i<TOTAL;i++){
        if(used[i]&&target[i]&&!placed[i]) available.push(i);
      }
      if(!available.length){
        $('oneNum').value='';
        return typeof flashStatus==='function' ? flashStatus('抽選対象の空席がありません。','bad') : null;
      }

      const validSeats=available.filter(idx=>{
        const test=placed.slice();
        test[idx]=String(val);
        return allPairsValid(test);
      });

      const candidates=validSeats.length ? validSeats : available;
      const idx=candidates[Math.floor(Math.random()*candidates.length)];

      const before=placed.slice();
      const run=++window.__seatDrawRun;
      $('oneNum').value='';
      n.disabled=true;

      const el=document.querySelectorAll('#seatGrid .desk')[idx];
      const ok=await window.flyTicketToSeat(String(val),el);

      if(ok && run===window.__seatDrawRun){
        placed[idx]=String(val);
        history.push({snapshot:before});
        renderSeats();
        updateStatus();
      }
      n.disabled=false;
    };
  }
})();
</script>


<script>
(function(){
  const $=id=>document.getElementById(id);

  function pairs(){
    return typeof window.getSeatConsiderPairs==='function'
      ? window.getSeatConsiderPairs()
      : [];
  }

  // Strict orthogonal adjacency:
  // same column + one row apart = front/back
  // same row + one column apart = left/right
  function isOrthogonalNeighbor(a,b){
    if(a<0 || b<0) return false;
    const ar=Math.floor(a/COLS), ac=a%COLS;
    const br=Math.floor(b/COLS), bc=b%COLS;
    return (ac===bc && Math.abs(ar-br)===1) ||
           (ar===br && Math.abs(ac-bc)===1);
  }

  function validArrangement(arr){
    for(const p of pairs()){
      if(!p?.a || !p?.b || String(p.a)===String(p.b)) continue;
      const ai=arr.findIndex(x=>String(x)===String(p.a));
      const bi=arr.findIndex(x=>String(x)===String(p.b));
      if(ai>=0 && bi>=0 && isOrthogonalNeighbor(ai,bi)) return false;
    }
    return true;
  }

  function shuffleCopy(arr){
    const a=arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [a[i],a[j]]=[a[j],a[i]];
    }
    return a;
  }

  function remainingNums(){
    const taken=new Set(placed.filter(Boolean).map(String));
    return roster.map(String).filter(n=>!taken.has(String(n)));
  }

  function availableSeatIndexes(){
    const out=[];
    for(let i=0;i<TOTAL;i++){
      if(used[i] && target[i] && !placed[i]) out.push(i);
    }
    return out;
  }

  // Find a complete valid arrangement for all currently unplaced students.
  // This makes single-draw use the same global planning rule as bulk draw.
  function findCompletePlan(forcedNum=null, forcedSeat=null, randomizeNums=true){
    let nums=remainingNums();
    const seats=availableSeatIndexes();

    if(nums.length < seats.length) return null;

    nums=nums.slice(0,seats.length);

    // If single draw specifies one number/seat, keep that pairing fixed,
    // and solve the rest around it.
    let fixedBase=placed.slice();
    let remainingSeats=seats.slice();
    let remainingNumbers=nums.slice();

    if(forcedNum!=null && forcedSeat!=null){
      fixedBase[forcedSeat]=String(forcedNum);
      remainingSeats=remainingSeats.filter(i=>i!==forcedSeat);
      let removed=false;
      remainingNumbers=remainingNumbers.filter(n=>{
        if(!removed && String(n)===String(forcedNum)){ removed=true; return false; }
        return true;
      });
    }

    // First check whether fixed part already violates a pair whose other member is placed.
    // validArrangement allows missing partner; only actual adjacency is rejected.
    if(!validArrangement(fixedBase)) return null;

    for(let attempt=0;attempt<10000;attempt++){
      const ss=shuffleCopy(remainingSeats);
      let ns=remainingNumbers.slice();
      if(randomizeNums) ns=shuffleCopy(ns);

      const test=fixedBase.slice();
      ns.forEach((n,k)=>test[ss[k]]=n);

      if(validArrangement(test)){
        return {
          final:test,
          seats:ss,
          nums:ns,
          forcedSeat,
          forcedNum,
          strict:true
        };
      }
    }
    return null;
  }

  // ---------- Bulk draw ----------
  async function runBulkGlobal(mode,btn){
    const run=++window.__seatDrawRun;
    let nums=remainingNums();
    const seats=availableSeatIndexes();

    if(!seats.length) return flashStatus('抽選対象の空席がありません。','bad');
    if(nums.length<seats.length) return flashStatus(`残り ${nums.length}人 ／ 対象 ${seats.length}席`,'bad');

    nums.sort((a,b)=>{
      const na=Number(a), nb=Number(b);
      if(Number.isFinite(na)&&Number.isFinite(nb)) return na-nb;
      return String(a).localeCompare(String(b),'ja');
    });
    nums=nums.slice(0,seats.length);

    let plan=null;

    // For "残り全て": number reveal order is ascending,
    // but destinations are globally planned.
    // For "ランダム": number reveal order itself is randomized too.
    for(let attempt=0;attempt<10000 && !plan;attempt++){
      const seatOrder=shuffleCopy(seats);
      const numOrder=mode==='random' ? shuffleCopy(nums) : nums.slice();
      const test=placed.slice();
      numOrder.forEach((n,k)=>test[seatOrder[k]]=n);
      if(validArrangement(test)){
        plan={seatOrder,numOrder,strict:true};
      }
    }

    // Only if truly no valid plan can be found, fall back.
    if(!plan){
      plan={
        seatOrder:shuffleCopy(seats),
        numOrder:mode==='random'?shuffleCopy(nums):nums.slice(),
        strict:false
      };
    }

    const before=placed.slice();
    btn.disabled=true;
    let any=false;

    for(let k=0;k<plan.numOrder.length;k++){
      if(run!==window.__seatDrawRun) break;
      const num=plan.numOrder[k];
      const idx=plan.seatOrder[k];
      const el=document.querySelectorAll('#seatGrid .desk')[idx];

      const ok=await window.flyTicketToSeat(num,el);
      if(!ok || run!==window.__seatDrawRun) break;

      placed[idx]=num;
      renderSeats();
      any=true;
    }

    if(any) history.push({snapshot:before});
    btn.disabled=false;

    if(run===window.__seatDrawRun){
      updateStatus();
      flashStatus(plan.strict?'配慮条件を守って配置しました':'配置可能な範囲で配慮しました','good');
    }
  }

  const ordered=$('orderedRestV101');
  if(ordered){
    const n=ordered.cloneNode(true);
    ordered.replaceWith(n);
    n.onclick=()=>runBulkGlobal('ordered',n);
  }

  const random=$('randomRestV101');
  if(random){
    const n=random.cloneNode(true);
    random.replaceWith(n);
    n.onclick=()=>runBulkGlobal('random',n);
  }

  // ---------- Single draw ----------
  const one=$('placeOne');
  if(one){
    const n=one.cloneNode(true);
    one.replaceWith(n);

    n.onclick=async()=>{
      let val=($('oneNum')?.value||'').trim();
      if(!val) return flashStatus('番号を入力してください。','bad');

      // Resolve registered name back to number.
      const labels=window.memberLabels||{};
      for(const [id,label] of Object.entries(labels)){
        if(String(label).trim()===val) val=String(id);
      }

      if(!Array.isArray(roster)||!roster.map(String).includes(String(val))){
        $('oneNum').value='';
        return flashStatus('使用しない番号です。','bad');
      }
      if(placed.some(x=>String(x)===String(val))){
        $('oneNum').value='';
        return flashStatus('この番号はすでに配置されています。','bad');
      }

      const seats=availableSeatIndexes();
      if(!seats.length){
        $('oneNum').value='';
        return flashStatus('抽選対象の空席がありません。','bad');
      }

      // Shuffle candidate seats, but only accept one that permits a complete
      // future arrangement satisfying every consideration pair.
      const candidates=shuffleCopy(seats);
      let chosen=-1;

      for(const seat of candidates){
        const plan=findCompletePlan(String(val),seat,true);
        if(plan){
          chosen=seat;
          break;
        }
      }

      // If no candidate allows a valid complete arrangement, only then allow fallback.
      if(chosen<0){
        chosen=candidates[Math.floor(Math.random()*candidates.length)];
      }

      const before=placed.slice();
      const run=++window.__seatDrawRun;
      $('oneNum').value='';
      n.disabled=true;

      const el=document.querySelectorAll('#seatGrid .desk')[chosen];
      const ok=await window.flyTicketToSeat(String(val),el);

      if(ok && run===window.__seatDrawRun){
        placed[chosen]=String(val);
        history.push({snapshot:before});
        renderSeats();
        updateStatus();
      }
      n.disabled=false;
    };
  }
})();
</script>


<script>
(function(){
  const SAVE_KEY='seatLayoutsV12';
  const $=id=>document.getElementById(id);

  function readLayouts(){
    try{
      const v=JSON.parse(localStorage.getItem(SAVE_KEY)||'[]');
      return Array.isArray(v)?v:[];
    }catch(e){ return []; }
  }

  function writeLayouts(v){
    localStorage.setItem(SAVE_KEY,JSON.stringify(v));
  }

  function currentLabels(){
    return {...(window.memberLabels||{})};
  }

  function saveCurrentLayout(){
    const name=prompt('保存する座席表の名前を入力してください');
    if(!name || !name.trim()) return;

    const list=readLayouts();
    list.push({
      id:Date.now()+'_'+Math.random().toString(16).slice(2),
      name:name.trim(),
      savedAt:new Date().toISOString(),
      used:Array.isArray(used)?used.slice():[],
      target:Array.isArray(target)?target.slice():[],
      placed:Array.isArray(placed)?placed.slice():[],
      roster:Array.isArray(roster)?roster.slice():[],
      memberLabels:currentLabels()
    });
    writeLayouts(list);

    if(typeof flashStatus==='function') flashStatus(`「${name.trim()}」を保存しました`,'good');
    else alert(`「${name.trim()}」を保存しました`);
  }

  // replace whichever app-save button is present
  ['saveAppV101','saveAppV10','saveApp'].forEach(id=>{
    const old=$(id);
    if(!old) return;
    const n=old.cloneNode(true);
    old.replaceWith(n);
    n.addEventListener('click',saveCurrentLayout);
  });

  // open saved layouts
  function openSavedLayouts(){
    const list=readLayouts();
    const overlay=$('savedOverlay');
    const box=$('savedBrowserList');
    const grid=$('savedPreviewGrid');
    const title=$('savedPreviewTitle');
    const use=$('savedUse');
    const close=$('savedClose');
    if(!overlay||!box||!grid||!title||!use||!close) return;

    let selected=-1;
    box.innerHTML='';
    grid.innerHTML='';
    title.textContent='座席を選択';
    use.disabled=true;

    if(!list.length){
      box.innerHTML='<div style="font-size:12px;color:#64748b;padding:8px">保存した座席はありません。</div>';
    }else{
      list.slice().reverse().forEach((item,revIndex)=>{
        const realIndex=list.length-1-revIndex;
        const b=document.createElement('button');
        b.className='savedItem';
        const d=new Date(item.savedAt);
        const ds=isNaN(d)?'':d.toLocaleString('ja-JP',{
          year:'numeric',month:'numeric',day:'numeric',
          hour:'2-digit',minute:'2-digit'
        });
        b.innerHTML=
          `<div class="savedItemName">${String(item.name||'名称なし').replace(/</g,'&lt;')}</div>`+
          `<div class="savedItemDate">${ds}</div>`;

        b.addEventListener('click',()=>{
          selected=realIndex;
          [...box.querySelectorAll('.savedItem')].forEach(x=>x.classList.remove('active'));
          b.classList.add('active');

          title.textContent=item.name||'保存した座席';
          grid.innerHTML='';
          for(let i=0;i<TOTAL;i++){
            const desk=document.createElement('div');
            desk.className='desk '+(item.used?.[i]?'':'off');
            const num=item.placed?.[i] ? String(item.placed[i]) : '';
            const label=num ? (item.memberLabels?.[num] || num) : '';
            desk.textContent=label;
            grid.appendChild(desk);
          }
          use.disabled=false;
        });
        box.appendChild(b);
      });
    }

    close.onclick=()=>overlay.classList.remove('show');
    use.onclick=()=>{
      if(selected<0||!list[selected]) return;
      const item=list[selected];
      used=item.used.slice();
      target=item.target.slice();
      placed=item.placed.slice();
      roster=item.roster.slice();
      window.memberLabels={...(item.memberLabels||{})};
      history=[];

      $('setup')?.classList.add('hide');
      $('rosterScreen')?.classList.add('hide');
      $('work')?.classList.remove('hide');

      overlay.classList.remove('show');
      renderSeats();
      updateStatus();
      if(typeof flashStatus==='function') flashStatus('保存した座席を呼び出しました','good');
    };

    overlay.classList.add('show');
  }

  ['openSavedV101','openSavedV10','openSavedBrowser'].forEach(id=>{
    const old=$(id);
    if(!old) return;
    const n=old.cloneNode(true);
    old.replaceWith(n);
    n.addEventListener('click',openSavedLayouts);
  });

  function roundRect(ctx,x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  async function buildA4Canvas(titleText){
    const W=3508,H=2480; // A4 landscape 300dpi
    const c=document.createElement('canvas');
    c.width=W;c.height=H;
    const ctx=c.getContext('2d');

    ctx.fillStyle='#ffffff';
    ctx.fillRect(0,0,W,H);

    // title
    ctx.fillStyle='#000';
    ctx.textAlign='center';
    ctx.font='700 92px sans-serif';
    ctx.fillText(titleText,W/2,120);

    // board
    const boardX=300, boardY=175, boardW=W-600, boardH=115;
    ctx.strokeStyle='#000';
    ctx.lineWidth=7;
    ctx.strokeRect(boardX,boardY,boardW,boardH);
    ctx.font='700 48px sans-serif';
    ctx.fillText('黒　板',W/2,248);

    const left=220, top=345, right=220, bottom=170;
    const gridW=W-left-right;
    const gridH=H-top-bottom;
    const cw=gridW/COLS;
    const ch=gridH/ROWS;

    for(let r=0;r<ROWS;r++){
      for(let col=0;col<COLS;col++){
        const i=r*COLS+col;
        if(!used[i]) continue;

        const x=left+col*cw+16;
        const y=top+r*ch+14;
        const w=cw-32;
        const h=ch-28;

        ctx.strokeStyle='#000';
        ctx.lineWidth=4;
        roundRect(ctx,x,y,w,h,18);
        ctx.stroke();

        const num=placed[i] ? String(placed[i]) : '';
        if(!num) continue;

        const name=(window.memberLabels?.[num] || num);

        // small number at top
        ctx.fillStyle='#000';
        ctx.textAlign='center';
        ctx.font='600 34px sans-serif';
        ctx.fillText(num,x+w/2,y+42);

        // large display name in the center
        let fs=60;
        if(String(name).length>=6) fs=50;
        if(String(name).length>=9) fs=42;
        ctx.font=`700 ${fs}px sans-serif`;

        const maxWidth=w-24;
        let txt=String(name);
        while(ctx.measureText(txt).width>maxWidth && fs>30){
          fs-=2;
          ctx.font=`700 ${fs}px sans-serif`;
        }
        ctx.fillText(txt,x+w/2,y+h/2+24);
      }
    }

    // subtle footer
    ctx.font='400 24px sans-serif';
    ctx.fillStyle='#666';
    ctx.fillText(new Date().toLocaleString('ja-JP'),W/2,H-55);

    return c;
  }

  async function saveA4Image(){
    const name=prompt('画像ファイルの名前を入力してください');
    if(!name || !name.trim()) return;

    const canvas=await buildA4Canvas(name.trim());
    const a=document.createElement('a');
    a.download=name.trim().replace(/[\\/:*?"<>|]/g,'_')+'_A4横.png';
    a.href=canvas.toDataURL('image/png');
    a.click();

    if(typeof flashStatus==='function') flashStatus('A4横向き画像を保存しました','good');
  }

  ['saveImageV101','saveImageV10','savePng'].forEach(id=>{
    const old=$(id);
    if(!old) return;
    const n=old.cloneNode(true);
    old.replaceWith(n);
    n.addEventListener('click',saveA4Image);
  });
})();
</script>


<script>
(function(){
  const $=id=>document.getElementById(id);

  // ---- Always read the CURRENT consideration settings ----
  function currentPairs(){
    // First sync visible selectors, so the latest edits are used immediately.
    const domPairs=[];
    document.querySelectorAll('#considerPairs2 .considerPairRow2').forEach(row=>{
      const s=row.querySelectorAll('select');
      const a=(s[0]?.value||'').trim();
      const b=(s[1]?.value||'').trim();
      if(a && b && a!==b) domPairs.push({a:String(a),b:String(b)});
    });
    if(domPairs.length) return domPairs;

    try{
      const v=JSON.parse(localStorage.getItem('seatConsiderPairsV3')||'[]');
      if(Array.isArray(v)){
        return v.filter(p=>p&&p.a&&p.b&&String(p.a)!==String(p.b))
                .map(p=>({a:String(p.a),b:String(p.b)}));
      }
    }catch(e){}
    return [];
  }

  function isNeighbor(a,b){
    if(a<0 || b<0) return false;
    const ar=Math.floor(a/COLS), ac=a%COLS;
    const br=Math.floor(b/COLS), bc=b%COLS;
    // front/back OR left/right only
    return (ac===bc && Math.abs(ar-br)===1) ||
           (ar===br && Math.abs(ac-bc)===1);
  }

  function shuffleCopy(a){
    const x=a.slice();
    for(let i=x.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [x[i],x[j]]=[x[j],x[i]];
    }
    return x;
  }

  function openSeats(){
    const a=[];
    for(let i=0;i<TOTAL;i++){
      if(used[i] && target[i] && !placed[i]) a.push(i);
    }
    return a;
  }

  function remainingIds(){
    const taken=new Set(placed.filter(Boolean).map(String));
    return roster.map(String).filter(x=>!taken.has(String(x)));
  }

  // Exact constraint solver for consideration members.
  // Returns a full map {studentId: seatIndex} when a valid arrangement exists.
  function solveConsiderationAssignments(basePlaced, candidateSeats, remainingStudents){
    const ps=currentPairs();
    if(!ps.length) return {};

    const placedSeat=new Map();
    basePlaced.forEach((v,i)=>{
      if(v!=='' && v!=null) placedSeat.set(String(v),i);
    });

    // If an already-placed pair is already adjacent, no future assignment can fix it.
    for(const p of ps){
      if(placedSeat.has(p.a) && placedSeat.has(p.b)){
        if(isNeighbor(placedSeat.get(p.a),placedSeat.get(p.b))) return null;
      }
    }

    const remainingSet=new Set(remainingStudents.map(String));
    const constrained=[...new Set(ps.flatMap(p=>[p.a,p.b]))]
      .filter(id=>remainingSet.has(id));

    // Build partner map.
    const partners=new Map();
    constrained.forEach(id=>partners.set(id,new Set()));
    ps.forEach(p=>{
      if(partners.has(p.a)) partners.get(p.a).add(p.b);
      if(partners.has(p.b)) partners.get(p.b).add(p.a);
    });

    // Most constrained first: people with more pair rules first.
    constrained.sort((a,b)=>(partners.get(b)?.size||0)-(partners.get(a)?.size||0));

    const assigned=new Map();
    const usedSeat=new Set();

    function seatAllowed(id,seat){
      for(const other of (partners.get(id)||[])){
        let otherSeat=null;
        if(placedSeat.has(other)) otherSeat=placedSeat.get(other);
        else if(assigned.has(other)) otherSeat=assigned.get(other);
        if(otherSeat!=null && isNeighbor(seat,otherSeat)) return false;
      }
      return true;
    }

    function dfs(pos){
      if(pos>=constrained.length) return true;

      const id=constrained[pos];
      // Randomize candidates to keep results feeling random.
      const options=shuffleCopy(candidateSeats.filter(s=>!usedSeat.has(s) && seatAllowed(id,s)));

      for(const seat of options){
        assigned.set(id,seat);
        usedSeat.add(seat);
        if(dfs(pos+1)) return true;
        assigned.delete(id);
        usedSeat.delete(seat);
      }
      return false;
    }

    return dfs(0) ? Object.fromEntries(assigned) : null;
  }

  // Can student "id" be placed at "seat" while still allowing ALL remaining
  // consideration rules to be satisfied later?
  function candidateCanLeadToValidFinal(id,seat){
    const base=placed.slice();
    base[seat]=String(id);

    const seats=openSeats().filter(s=>s!==seat);
    const students=remainingIds().filter(x=>String(x)!==String(id));

    const result=solveConsiderationAssignments(base,seats,students);
    return result!==null;
  }

  // ---- Replace single draw with exact consideration-aware draw ----
  const old=$('placeOne');
  if(old){
    const n=old.cloneNode(true);
    old.replaceWith(n);

    n.onclick=async()=>{
      let val=($('oneNum')?.value||'').trim();
      if(!val) return flashStatus('番号を入力してください。','bad');

      // name -> number
      const labels=window.memberLabels||{};
      for(const [id,label] of Object.entries(labels)){
        if(String(label).trim()===val) val=String(id);
      }

      if(!Array.isArray(roster) || !roster.map(String).includes(String(val))){
        $('oneNum').value='';
        return flashStatus('使用しない番号です。','bad');
      }
      if(placed.some(x=>String(x)===String(val))){
        $('oneNum').value='';
        return flashStatus('この番号はすでに配置されています。','bad');
      }

      const seats=openSeats();
      if(!seats.length){
        $('oneNum').value='';
        return flashStatus('抽選対象の空席がありません。','bad');
      }

      // Try every candidate seat. A seat is accepted only if the rest of the class
      // can still be completed without breaking ANY consideration pair.
      const candidates=shuffleCopy(seats);
      const valid=candidates.filter(seat=>candidateCanLeadToValidFinal(String(val),seat));

      // Only allow adjacency if NO valid candidate exists at all.
      const chosen=(valid.length ? valid : candidates)[0];

      const before=placed.slice();
      const run=++window.__seatDrawRun;
      $('oneNum').value='';
      n.disabled=true;

      const el=document.querySelectorAll('#seatGrid .desk')[chosen];
      const ok=await window.flyTicketToSeat(String(val),el);

      if(ok && run===window.__seatDrawRun){
        placed[chosen]=String(val);
        history.push({snapshot:before});
        renderSeats();
        updateStatus();

        if(valid.length===0 && currentPairs().length){
          flashStatus('配慮条件を満たせる席がないため通常配置しました','good');
        }
      }
      n.disabled=false;
    };
  }

  // ---- Also replace bulk random/ordered with the same exact solver ----
  async function bulkExact(mode,btn){
    const run=++window.__seatDrawRun;
    let nums=remainingIds();
    const seats=openSeats();

    if(!seats.length) return flashStatus('抽選対象の空席がありません。','bad');
    if(nums.length<seats.length) return flashStatus(`残り ${nums.length}人 ／ 対象 ${seats.length}席`,'bad');

    nums.sort((a,b)=>{
      const na=Number(a), nb=Number(b);
      if(Number.isFinite(na)&&Number.isFinite(nb)) return na-nb;
      return String(a).localeCompare(String(b),'ja');
    });
    nums=nums.slice(0,seats.length);

    const assignment=solveConsiderationAssignments(placed.slice(),seats,nums);

    let seatByNum={};
    let strict=assignment!==null;

    if(strict){
      seatByNum={...assignment};

      // Fill unconstrained students into the remaining seats randomly.
      const usedAssigned=new Set(Object.values(seatByNum).map(Number));
      let leftoverSeats=shuffleCopy(seats.filter(s=>!usedAssigned.has(s)));
      const unassigned=nums.filter(id=>seatByNum[id]==null);

      unassigned.forEach((id,i)=>seatByNum[id]=leftoverSeats[i]);
    }else{
      // Only fallback if the constraint solver proves no valid assignment exists.
      const ss=shuffleCopy(seats);
      nums.forEach((id,i)=>seatByNum[id]=ss[i]);
    }

    // Animation order:
    // ordered => ascending number order
    // random  => random number order
    let revealOrder=mode==='random' ? shuffleCopy(nums) : nums.slice();

    const before=placed.slice();
    btn.disabled=true;
    let any=false;

    for(const num of revealOrder){
      if(run!==window.__seatDrawRun) break;
      const idx=seatByNum[num];
      const el=document.querySelectorAll('#seatGrid .desk')[idx];

      const ok=await window.flyTicketToSeat(num,el);
      if(!ok || run!==window.__seatDrawRun) break;

      placed[idx]=num;
      renderSeats();
      any=true;
    }

    if(any) history.push({snapshot:before});
    btn.disabled=false;

    if(run===window.__seatDrawRun){
      updateStatus();
      flashStatus(
        strict ? '配慮条件を守って配置しました' : '配慮条件を満たせないため通常配置しました',
        'good'
      );
    }
  }

  const ordered=$('orderedRestV101');
  if(ordered){
    const n=ordered.cloneNode(true);
    ordered.replaceWith(n);
    n.onclick=()=>bulkExact('ordered',n);
  }

  const random=$('randomRestV101');
  if(random){
    const n=random.cloneNode(true);
    random.replaceWith(n);
    n.onclick=()=>bulkExact('random',n);
  }
})();
</script>


<script>
(function(){
  const $=id=>document.getElementById(id);
  const SAVE_KEY='seatLayoutsStableV1';

  function readSaved(){
    try{
      const v=JSON.parse(localStorage.getItem(SAVE_KEY)||'[]');
      return Array.isArray(v)?v:[];
    }catch(e){return []}
  }
  function writeSaved(v){
    localStorage.setItem(SAVE_KEY,JSON.stringify(v));
  }

  function saveCurrent(){
    const name=prompt('保存名を入力してください');
    if(!name || !name.trim()) return;

    const item={
      id:Date.now()+'_'+Math.random().toString(16).slice(2),
      name:name.trim(),
      savedAt:new Date().toISOString(),
      used:Array.isArray(used)?used.slice():[],
      target:Array.isArray(target)?target.slice():[],
      placed:Array.isArray(placed)?placed.slice():[],
      roster:Array.isArray(roster)?roster.slice():[],
      memberLabels:{...(window.memberLabels||{})}
    };

    const list=readSaved();
    list.push(item);
    writeSaved(list);

    if(typeof flashStatus==='function') flashStatus('現在の座席を保存しました','good');
    else alert('現在の座席を保存しました');
  }

  // Completely replace all possible app-save buttons.
  ['saveAppV101','saveAppV10','saveApp'].forEach(id=>{
    const old=$(id);
    if(!old) return;
    const n=old.cloneNode(true);
    old.replaceWith(n);
    n.disabled=false;
    n.addEventListener('click',saveCurrent);
  });

  // Stable saved-layout opener.
  function openSaved(){
    const list=readSaved();
    const overlay=$('savedOverlay');
    const box=$('savedBrowserList');
    const grid=$('savedPreviewGrid');
    const title=$('savedPreviewTitle');
    const use=$('savedUse');
    const close=$('savedClose');
    if(!overlay||!box||!grid||!title||!use||!close) return;

    let selected=-1;
    box.innerHTML='';
    grid.innerHTML='';
    title.textContent='座席を選択';
    use.disabled=true;

    if(!list.length){
      box.innerHTML='<div style="padding:8px;font-size:12px;color:#64748b">保存した座席はありません。</div>';
    }else{
      list.slice().reverse().forEach((item,ri)=>{
        const real=list.length-1-ri;
        const b=document.createElement('button');
        b.className='savedItem';

        const d=new Date(item.savedAt);
        const ds=isNaN(d)?'':d.toLocaleString('ja-JP',{
          year:'numeric',month:'numeric',day:'numeric',
          hour:'2-digit',minute:'2-digit'
        });

        b.innerHTML=
          `<div class="savedItemName">${String(item.name||'名称なし').replace(/</g,'&lt;')}</div>`+
          `<div class="savedItemDate">${ds}</div>`;

        b.addEventListener('click',()=>{
          selected=real;
          [...box.querySelectorAll('.savedItem')].forEach(x=>x.classList.remove('active'));
          b.classList.add('active');
          title.textContent=item.name||'保存した座席';
          grid.innerHTML='';

          for(let i=0;i<TOTAL;i++){
            const dsk=document.createElement('div');
            dsk.className='desk '+(item.used?.[i]?'':'off');
            const num=item.placed?.[i]?String(item.placed[i]):'';
            dsk.textContent=num ? (item.memberLabels?.[num]||num) : '';
            grid.appendChild(dsk);
          }
          use.disabled=false;
        });

        box.appendChild(b);
      });
    }

    close.onclick=()=>overlay.classList.remove('show');
    use.onclick=()=>{
      if(selected<0 || !list[selected]) return;
      const item=list[selected];

      used=item.used.slice();
      target=item.target.slice();
      placed=item.placed.slice();
      roster=item.roster.slice();
      window.memberLabels={...(item.memberLabels||{})};
      history=[];

      $('setup')?.classList.add('hide');
      $('rosterScreen')?.classList.add('hide');
      $('work')?.classList.remove('hide');

      overlay.classList.remove('show');
      renderSeats();
      updateStatus();

      if(typeof flashStatus==='function') flashStatus('保存した座席を呼び出しました','good');
    };

    overlay.classList.add('show');
  }

  ['openSavedV101','openSavedV10','openSavedBrowser'].forEach(id=>{
    const old=$(id);
    if(!old) return;
    const n=old.cloneNode(true);
    old.replaceWith(n);
    n.disabled=false;
    n.addEventListener('click',openSaved);
  });

  // ---------- Draw button stability ----------
  function enableDrawButtons(){
    ['placeOne','orderedRestV101','randomRestV101','autoRest'].forEach(id=>{
      const b=$(id);
      if(b) b.disabled=false;
    });
  }

  // Always recover button states when returning to the work screen.
  ['rosterNext2','backSetup','rosterBack'].forEach(id=>{
    const el=$(id);
    if(el){
      el.addEventListener('click',()=>{
        setTimeout(enableDrawButtons,80);
      },true);
    }
  });

  // Also recover after page/app becomes visible again.
  document.addEventListener('visibilitychange',()=>{
    if(!document.hidden) enableDrawButtons();
  });
  window.addEventListener('pageshow',enableDrawButtons);
  window.addEventListener('focus',enableDrawButtons);

  // Safety watchdog: never leave draw controls disabled indefinitely.
  setInterval(()=>{
    const work=$('work');
    if(work && !work.classList.contains('hide')){
      const activeAnim=document.querySelector('.nameFlight,.nameReveal,.nameFly,.ticketFly,.drawStage');
      if(!activeAnim) enableDrawButtons();
    }
  },1200);

  // Patch single-draw button with try/finally so it always re-enables.
  const one=$('placeOne');
  if(one){
    const oldHandler=one.onclick;
    if(oldHandler){
      one.onclick=async function(e){
        try{
          return await oldHandler.call(this,e);
        }catch(err){
          console.error(err);
          if(typeof flashStatus==='function') flashStatus('抽選処理でエラーが発生しました','bad');
        }finally{
          this.disabled=false;
        }
      };
    }
  }

  // Patch bulk buttons similarly.
  ['orderedRestV101','randomRestV101','autoRest'].forEach(id=>{
    const b=$(id);
    if(!b || !b.onclick) return;
    const oldHandler=b.onclick;
    b.onclick=async function(e){
      try{
        return await oldHandler.call(this,e);
      }catch(err){
        console.error(err);
        if(typeof flashStatus==='function') flashStatus('抽選処理でエラーが発生しました','bad');
      }finally{
        this.disabled=false;
      }
    };
  });

  enableDrawButtons();
})();
</script>


<script>
(function(){
  const btn=document.getElementById('clearPlaced');
  if(!btn) return;

  // Replace any broken/overwritten handler with one stable reset handler.
  const n=btn.cloneNode(true);
  btn.replaceWith(n);

  n.disabled=false;
  n.addEventListener('click',()=>{
    const ok=confirm('最初からやり直しますか？');
    if(!ok) return;

    // Stop any animation/bulk draw currently in progress.
    try{
      if(typeof window.cancelSeatDraw==='function') window.cancelSeatDraw();
      else if(typeof window.__seatDrawRun!=='undefined') window.__seatDrawRun++;
    }catch(e){}

    // Reset only the current seating result.
    placed=Array(TOTAL).fill('');
    history=[];
    target=used.map(Boolean);

    const input=document.getElementById('oneNum');
    if(input) input.value='';

    // Remove any lingering animation/effect elements.
    document.querySelectorAll(
      '.nameFlight,.nameReveal,.nameFly,.ticketFly,.drawStage,.impactWave,.impactCore,.impactRay'
    ).forEach(el=>el.remove());

    // Re-enable all draw controls.
    ['placeOne','orderedRestV101','randomRestV101','autoRest','clearPlaced','undoBtn'].forEach(id=>{
      const b=document.getElementById(id);
      if(b) b.disabled=false;
    });

    renderSeats();
    updateStatus();

    if(typeof flashStatus==='function'){
      flashStatus('座席を最初からやり直しました','good');
    }
  });
})();
</script>

<script>
(function(){
  const $=id=>document.getElementById(id);
  const SAVE_KEY='seatLayoutsStableV2';

  // ---------- Undo / Redo ----------
  // We keep a redo stack containing the state that existed before "戻る" was pressed.
  window.__seatRedoStack = window.__seatRedoStack || [];

  function clonePlaced(){
    return Array.isArray(placed) ? placed.slice() : Array(TOTAL).fill('');
  }

  function refreshUndoRedoButtons(){
    const undo=$('undoBtn');
    const redo=$('clearPlaced');
    if(undo) undo.disabled = !Array.isArray(history) || history.length===0;
    if(redo) redo.disabled = !window.__seatRedoStack.length;
  }

  // Stable Undo: save current state into redo stack, then restore previous snapshot.
  const undoOld=$('undoBtn');
  if(undoOld){
    const undo=undoOld.cloneNode(true);
    undoOld.replaceWith(undo);
    undo.textContent='戻る';

    undo.addEventListener('click',()=>{
      if(!Array.isArray(history) || !history.length){
        if(typeof flashStatus==='function') flashStatus('戻せる操作がありません。','bad');
        refreshUndoRedoButtons();
        return;
      }

      try{
        if(typeof window.cancelSeatDraw==='function') window.cancelSeatDraw();
      }catch(e){}

      const current=clonePlaced();
      const h=history.pop();

      // Store current state so Redo can restore it.
      window.__seatRedoStack.push(current);

      if(h && Array.isArray(h.snapshot)){
        placed=h.snapshot.slice();
      }else if(h && typeof h.idx==='number'){
        placed[h.idx]='';
      }else if(h && Array.isArray(h.seats)){
        h.seats.forEach(i=>placed[i]='');
      }

      renderSeats();
      updateStatus();
      refreshUndoRedoButtons();

      if(typeof flashStatus==='function') flashStatus('1つ前の状態に戻しました','good');
    });
  }

  // "やり直し" = redo the state that existed immediately before Undo.
  const redoOld=$('clearPlaced');
  if(redoOld){
    const redo=redoOld.cloneNode(true);
    redoOld.replaceWith(redo);
    redo.textContent='やり直し';

    redo.addEventListener('click',()=>{
      if(!window.__seatRedoStack.length){
        if(typeof flashStatus==='function') flashStatus('やり直せる操作がありません。','bad');
        refreshUndoRedoButtons();
        return;
      }

      try{
        if(typeof window.cancelSeatDraw==='function') window.cancelSeatDraw();
      }catch(e){}

      const current=clonePlaced();
      const next=window.__seatRedoStack.pop();

      // Current state becomes undoable again.
      history.push({snapshot:current});
      placed=next.slice();

      renderSeats();
      updateStatus();
      refreshUndoRedoButtons();

      if(typeof flashStatus==='function') flashStatus('戻す前の状態に戻しました','good');
    });
  }

  // Any NEW seating operation clears redo history.
  // Watch for changes to placed that occur after draw controls are used.
  ['placeOne','orderedRestV101','randomRestV101','autoRest'].forEach(id=>{
    const b=$(id);
    if(!b) return;
    b.addEventListener('click',()=>{
      window.__seatRedoStack=[];
      setTimeout(refreshUndoRedoButtons,0);
    },true);
  });

  // Also clear redo if seats are manually swapped.
  document.addEventListener('click',e=>{
    if(e.target.closest?.('#seatGrid .desk')){
      setTimeout(refreshUndoRedoButtons,50);
    }
  },true);

  // ---------- App Save ----------
  function readSaved(){
    try{
      const v=JSON.parse(localStorage.getItem(SAVE_KEY)||'[]');
      return Array.isArray(v)?v:[];
    }catch(e){ return []; }
  }

  function writeSaved(v){
    localStorage.setItem(SAVE_KEY,JSON.stringify(v));
  }

  function saveCurrent(){
    const name=prompt('保存名を入力してください');
    if(!name || !name.trim()) return;

    const list=readSaved();
    list.push({
      id:Date.now()+'_'+Math.random().toString(16).slice(2),
      name:name.trim(),
      savedAt:new Date().toISOString(),
      used:Array.isArray(used)?used.slice():[],
      target:Array.isArray(target)?target.slice():[],
      placed:Array.isArray(placed)?placed.slice():[],
      roster:Array.isArray(roster)?roster.slice():[],
      memberLabels:{...(window.memberLabels||{})}
    });
    writeSaved(list);

    if(typeof flashStatus==='function') flashStatus('アプリ保存一覧に登録しました','good');
  }

  ['saveAppV101','saveAppV10','saveApp'].forEach(id=>{
    const old=$(id);
    if(!old) return;
    const n=old.cloneNode(true);
    old.replaceWith(n);
    n.disabled=false;
    n.addEventListener('click',saveCurrent);
  });

  function renderSavedListUI(){
    const list=readSaved();
    const overlay=$('savedOverlay');
    const box=$('savedBrowserList');
    const grid=$('savedPreviewGrid');
    const title=$('savedPreviewTitle');
    const use=$('savedUse');
    const close=$('savedClose');
    if(!overlay||!box||!grid||!title||!use||!close) return;

    let selectedId=null;
    box.innerHTML='';
    grid.innerHTML='';
    title.textContent='座席を選択';
    use.disabled=true;

    if(!list.length){
      box.innerHTML='<div style="padding:8px;font-size:12px;color:#64748b">保存した座席はありません。</div>';
    }else{
      list.slice().reverse().forEach(item=>{
        const row=document.createElement('div');
        row.className='savedItem';

        const info=document.createElement('button');
        info.style.cssText='border:0;background:transparent;text-align:left;padding:0;min-width:0';
        const d=new Date(item.savedAt);
        const ds=isNaN(d)?'':d.toLocaleString('ja-JP',{
          year:'numeric',month:'numeric',day:'numeric',
          hour:'2-digit',minute:'2-digit'
        });
        info.innerHTML=
          `<div class="savedItemName">${String(item.name||'名称なし').replace(/</g,'&lt;')}</div>`+
          `<div class="savedItemDate">${ds}</div>`;

        const rename=document.createElement('button');
        rename.className='renameSavedBtn';
        rename.textContent='名前変更';

        const del=document.createElement('button');
        del.className='renameSavedBtn';
        del.textContent='削除';

        info.addEventListener('click',()=>{
          selectedId=item.id;
          [...box.querySelectorAll('.savedItem')].forEach(x=>x.classList.remove('active'));
          row.classList.add('active');

          title.textContent=item.name||'保存した座席';
          grid.innerHTML='';
          for(let i=0;i<TOTAL;i++){
            const desk=document.createElement('div');
            desk.className='desk '+(item.used?.[i]?'':'off');
            const num=item.placed?.[i]?String(item.placed[i]):'';
            desk.textContent=num ? (item.memberLabels?.[num]||num) : '';
            grid.appendChild(desk);
          }
          use.disabled=false;

        rename.addEventListener('click',e=>{
          e.stopPropagation();
          const next=prompt('新しい保存名を入力してください',item.name||'');

            overlay.classList.add('show');
          }
        });

        del.addEventListener('click',e=>{
          e.stopPropagation();
          if(!confirm('この保存を削除しますか？')) return;
          const current=readSaved().filter(x=>x.id!==item.id);
          writeSaved(current);
          renderSavedListUI();
          overlay.classList.add('show');

        row.append(info,rename,del);
