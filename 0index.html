      placed=item.placed.slice();
      roster=item.roster.slice();
      window.memberLabels={...(item.memberLabels||{})};
      history=[];
      window.__seatRedoStack=[];

      $('setup')?.classList.add('hide');
      $('rosterScreen')?.classList.add('hide');
      $('work')?.classList.remove('hide');

      overlay.classList.remove('show');
      renderSeats();
      updateStatus();
      refreshUndoRedoButtons();

      if(typeof flashStatus==='function') flashStatus('保存した座席を呼び出しました','good');
    };
  }

  function openSaved(){
    renderSavedListUI();
    $('savedOverlay')?.classList.add('show');
  }

  ['openSavedV101','openSavedV10','openSavedBrowser'].forEach(id=>{
    const old=$(id);
    if(!old) return;
    const n=old.cloneNode(true);
    old.replaceWith(n);
    n.disabled=false;
    n.addEventListener('click',openSaved);
  });

  refreshUndoRedoButtons();
})();
</script>


<script>
(function(){
  // 配慮の優先順位：
  // 1. 左右を最優先で避ける
  // 2. 次に前後を避ける
  // 3. 最後にななめを避ける
  //
  // 条件を完全に満たせない場合は、
  // ななめ → 前後 → 左右 の順に妥協する。

  function currentConsiderPairsPriority(){
    if(typeof window.getSeatConsiderPairs==='function'){
      return window.getSeatConsiderPairs()
        .filter(p=>p && p.a && p.b && String(p.a)!==String(p.b))
        .map(p=>({a:String(p.a),b:String(p.b)}));
    }
    return [];
  }

  function relationType(a,b){
    if(a<0 || b<0) return null;
    const ar=Math.floor(a/COLS), ac=a%COLS;
    const br=Math.floor(b/COLS), bc=b%COLS;
    const dr=Math.abs(ar-br), dc=Math.abs(ac-bc);

    if(dr===0 && dc===1) return 'side';   // 左右
    if(dr===1 && dc===0) return 'front';  // 前後
    if(dr===1 && dc===1) return 'diag';   // ななめ
    return null;
  }

  // 大きいほど避けたい。
  // 左右 > 前後 > ななめ
  const WEIGHT={
    side:1000000,
    front:10000,
    diag:100
  };

  function considerationScore(arr){
    let score=0;
    const pairs=currentConsiderPairsPriority();

    for(const p of pairs){
      const ai=arr.findIndex(x=>String(x)===p.a);
      const bi=arr.findIndex(x=>String(x)===p.b);
      if(ai<0 || bi<0) continue;

      const type=relationType(ai,bi);
      if(type) score+=WEIGHT[type];
    }
    return score;
  }

  function shufflePriority(a){
    const x=a.slice();
    for(let i=x.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [x[i],x[j]]=[x[j],x[i]];
    }
    return x;
  }

  function remainingPriority(){
    const taken=new Set(placed.filter(Boolean).map(String));
    return roster.map(String).filter(n=>!taken.has(String(n)));
  }

  function seatsPriority(){
    const out=[];
    for(let i=0;i<TOTAL;i++){
      if(used[i] && target[i] && !placed[i]) out.push(i);
    }
    return out;
  }

  // 全体配置を多数探索し、最も優先度の高い配置を選ぶ。
  // score 0 = 左右・前後・ななめ全て回避
  function buildPriorityPlan(nums,seats,randomizeNums){
    let best=null;
    let bestScore=Infinity;

    for(let attempt=0;attempt<12000;attempt++){
      const seatOrder=shufflePriority(seats);
      const numOrder=randomizeNums ? shufflePriority(nums) : nums.slice();

      const test=placed.slice();
      numOrder.forEach((n,k)=>test[seatOrder[k]]=n);

      const score=considerationScore(test);

      if(score<bestScore){
        bestScore=score;
        best={
          seatOrder:seatOrder.slice(),
          numOrder:numOrder.slice(),
          score
        };
        if(score===0) break;
      }
    }
    return best;
  }

  async function priorityBulk(mode,btn){
    const run=++window.__seatDrawRun;
    let nums=remainingPriority();
    const seats=seatsPriority();

    if(!seats.length){
      return typeof flashStatus==='function'
        ? flashStatus('抽選対象の空席がありません。','bad')
        : null;
    }
    if(nums.length<seats.length){
      return typeof flashStatus==='function'
        ? flashStatus(`残り ${nums.length}人 ／ 対象 ${seats.length}席`,'bad')
        : null;
    }

    nums.sort((a,b)=>{
      const na=Number(a), nb=Number(b);
      if(Number.isFinite(na)&&Number.isFinite(nb)) return na-nb;
      return String(a).localeCompare(String(b),'ja');
    });
    nums=nums.slice(0,seats.length);

    const plan=buildPriorityPlan(nums,seats,mode==='random');
    if(!plan) return;

    const before=placed.slice();
    btn.disabled=true;

    try{
      for(let k=0;k<plan.numOrder.length;k++){
        if(run!==window.__seatDrawRun) break;

        const num=plan.numOrder[k];
        const idx=plan.seatOrder[k];
        const el=document.querySelectorAll('#seatGrid .desk')[idx];

        const ok=await window.flyTicketToSeat(num,el);
        if(!ok || run!==window.__seatDrawRun) break;

        placed[idx]=num;
        renderSeats();
      }

      if(run===window.__seatDrawRun){
        history.push({snapshot:before});
        if(window.__seatRedoStack) window.__seatRedoStack=[];
        updateStatus();

        if(typeof flashStatus==='function'){
          if(plan.score===0){
            flashStatus('配慮条件をすべて反映して配置しました','good');
          }else if(plan.score < WEIGHT.front){
            flashStatus('左右・前後を優先して配置しました','good');
          }else if(plan.score < WEIGHT.side){
            flashStatus('左右を最優先して配置しました','good');
          }else{
            flashStatus('配置可能な範囲で配慮しました','good');
          }
        }
      }
    }finally{
      btn.disabled=false;
    }
  }

  // 一人抽選でも「この人をこの席に置いた後の完成形」の
  // 配慮スコアを比較して、最善の席を選ぶ。
  function bestSingleSeat(id){
    const candidates=shufflePriority(seatsPriority());
    if(!candidates.length) return -1;

    let bestSeat=candidates[0];
    let bestScore=Infinity;

    for(const candidate of candidates){
      const original=placed[candidate];
      placed[candidate]=String(id);

      const restNums=remainingPriority().filter(n=>String(n)!==String(id));
      const restSeats=seatsPriority().filter(s=>s!==candidate);

      let score;
      if(restSeats.length && restNums.length>=restSeats.length){
        const plan=buildPriorityPlan(
          restNums.slice(0,restSeats.length),
          restSeats,
          true
        );
        score=plan ? plan.score : considerationScore(placed);
      }else{
        score=considerationScore(placed);
      }

      placed[candidate]=original;

      if(score<bestScore){
        bestScore=score;
        bestSeat=candidate;
        if(score===0) break;
      }
    }
    return bestSeat;
  }

  const one=document.getElementById('placeOne');
  if(one){
    const n=one.cloneNode(true);
    one.replaceWith(n);

    n.onclick=async()=>{
      let val=(document.getElementById('oneNum')?.value||'').trim();
      if(!val) return flashStatus('番号を入力してください。','bad');

      const labels=window.memberLabels||{};
      for(const [id,label] of Object.entries(labels)){
        if(String(label).trim()===val) val=String(id);
      }

      if(!roster.map(String).includes(String(val))){
        document.getElementById('oneNum').value='';
        return flashStatus('使用しない番号です。','bad');
      }
      if(placed.some(x=>String(x)===String(val))){
        document.getElementById('oneNum').value='';
        return flashStatus('この番号はすでに配置されています。','bad');
      }

      const idx=bestSingleSeat(String(val));
      if(idx<0){
        document.getElementById('oneNum').value='';
        return flashStatus('抽選対象の空席がありません。','bad');
      }

      const before=placed.slice();
      const run=++window.__seatDrawRun;
      document.getElementById('oneNum').value='';
      n.disabled=true;

      try{
        const el=document.querySelectorAll('#seatGrid .desk')[idx];
        const ok=await window.flyTicketToSeat(String(val),el);

        if(ok && run===window.__seatDrawRun){
          placed[idx]=String(val);
          history.push({snapshot:before});
          if(window.__seatRedoStack) window.__seatRedoStack=[];
          renderSeats();
          updateStatus();
        }
      }finally{
        n.disabled=false;
      }
    };
  }

  const ordered=document.getElementById('orderedRestV101');
  if(ordered){
    const n=ordered.cloneNode(true);
    ordered.replaceWith(n);
    n.onclick=()=>priorityBulk('ordered',n);
  }

  const random=document.getElementById('randomRestV101');
  if(random){
    const n=random.cloneNode(true);
    random.replaceWith(n);
    n.onclick=()=>priorityBulk('random',n);
  }
})();
</script>


<script>
(function(){
  const $ = id => document.getElementById(id);

  // =========================================================
  // 1) Undo / Redo を最後に一本化
  // =========================================================
  window.__seatRedoStack = [];

  function clonePlaced(){
    return Array.isArray(placed) ? placed.slice() : Array(TOTAL).fill('');
  }

  function enableHistoryButtons(){
    const u=$('undoBtn'), r=$('clearPlaced');
    if(u) u.disabled = !(Array.isArray(history) && history.length);
    if(r) r.disabled = !window.__seatRedoStack.length;
  }

  const undoOld=$('undoBtn');
  if(undoOld){
    const undo=undoOld.cloneNode(true);
    undoOld.replaceWith(undo);
    undo.textContent='戻る';

    undo.addEventListener('click',()=>{
      if(!Array.isArray(history) || !history.length){
        if(typeof flashStatus==='function') flashStatus('戻せる操作がありません。','bad');
        enableHistoryButtons();
        return;
      }

      try{
        if(typeof window.cancelSeatDraw==='function') window.cancelSeatDraw();
        else if(typeof window.__seatDrawRun!=='undefined') window.__seatDrawRun++;
      }catch(e){}

      const current=clonePlaced();
      const h=history.pop();

      window.__seatRedoStack.push(current);

      if(h && Array.isArray(h.snapshot)){
        placed=h.snapshot.slice();
      }else if(h && typeof h.idx==='number'){
        placed[h.idx]='';
      }else if(h && Array.isArray(h.seats)){
        h.seats.forEach(i=>placed[i]='');
      }

      renderSeats();
      updateStatus();
      enableHistoryButtons();

      if(typeof flashStatus==='function') flashStatus('1つ前の状態に戻しました','good');
    });
  }

  const redoOld=$('clearPlaced');
  if(redoOld){
    const redo=redoOld.cloneNode(true);
    redoOld.replaceWith(redo);
    redo.textContent='やりなおし';

    redo.addEventListener('click',()=>{
      if(!window.__seatRedoStack.length){
        if(typeof flashStatus==='function') flashStatus('やりなおせる操作がありません。','bad');
        enableHistoryButtons();
        return;
      }

      try{
        if(typeof window.cancelSeatDraw==='function') window.cancelSeatDraw();
        else if(typeof window.__seatDrawRun!=='undefined') window.__seatDrawRun++;
      }catch(e){}

      const current=clonePlaced();
      const next=window.__seatRedoStack.pop();

      history.push({snapshot:current});
      placed=next.slice();

      renderSeats();
      updateStatus();
      enableHistoryButtons();

      if(typeof flashStatus==='function') flashStatus('戻す前の状態に戻しました','good');
    });
  }

  // 新しい抽選や入れ替えが始まったら redo は破棄
  ['placeOne','orderedRestV101','randomRestV101','autoRest'].forEach(id=>{
    const b=$(id);
    if(!b) return;
    b.addEventListener('click',()=>{
      window.__seatRedoStack=[];
      setTimeout(enableHistoryButtons,0);
    },true);
  });

  document.addEventListener('click',e=>{
    if(e.target.closest?.('#seatGrid .desk')){
      setTimeout(enableHistoryButtons,30);
    }
  },true);

  // =========================================================
  // 2) アプリ保存を最後に一本化
  // =========================================================
  const SAVE_KEY='seatAppSavedLayoutsFinalV1';

  function readSaved(){
    try{
      const v=JSON.parse(localStorage.getItem(SAVE_KEY)||'[]');
      return Array.isArray(v)?v:[];
    }catch(e){
      return [];
    }
  }

  function writeSaved(list){
    localStorage.setItem(SAVE_KEY,JSON.stringify(list));
  }

  function saveCurrentLayout(){
    const name=prompt('保存名を入力してください');
    if(!name || !name.trim()) return;

    const list=readSaved();
    const item={
      id:Date.now()+'_'+Math.random().toString(16).slice(2),
      name:name.trim(),
      savedAt:new Date().toISOString(),
      used:Array.isArray(used)?used.slice():[],
      target:Array.isArray(target)?target.slice():[],
      placed:Array.isArray(placed)?placed.slice():[],
      roster:Array.isArray(roster)?roster.slice():[],
      memberLabels:{...(window.memberLabels||{})}
    };

    list.push(item);
    writeSaved(list);

    if(typeof flashStatus==='function'){
      flashStatus(`「${item.name}」をアプリ保存しました`,'good');
    }else{
      alert(`「${item.name}」をアプリ保存しました`);
    }
  }

  ['saveAppV101','saveAppV10','saveApp'].forEach(id=>{
    const old=$(id);
    if(!old) return;
    const n=old.cloneNode(true);
    old.replaceWith(n);
    n.disabled=false;
    n.addEventListener('click',saveCurrentLayout);
  });

  // =========================================================
  // 3) 保存一覧を同じ保存領域から読む
  // =========================================================
  function renderPreview(item){
    const grid=$('savedPreviewGrid');
    const title=$('savedPreviewTitle');
    if(!grid||!title) return;

    title.textContent=item.name||'保存した座席';
    grid.innerHTML='';

    for(let i=0;i<TOTAL;i++){
      const d=document.createElement('div');
      d.className='desk '+(item.used?.[i]?'':'off');

      const num=item.placed?.[i] ? String(item.placed[i]) : '';
      d.textContent=num ? (item.memberLabels?.[num] || num) : '';

      grid.appendChild(d);
    }
  }

  function openSavedList(){
    const list=readSaved();
    const overlay=$('savedOverlay');
    const box=$('savedBrowserList');
    const use=$('savedUse');
    const close=$('savedClose');
    const preview=$('savedPreviewGrid');
    const title=$('savedPreviewTitle');

    if(!overlay||!box||!use||!close||!preview||!title) return;

    let selectedId=null;
    box.innerHTML='';
    preview.innerHTML='';
    title.textContent='座席を選択';
    use.disabled=true;

    if(!list.length){
      box.innerHTML='<div style="padding:8px;font-size:12px;color:#64748b">保存した座席はありません。</div>';
    }else{
      list.slice().reverse().forEach(item=>{
        const row=document.createElement('div');
        row.className='savedItem';

        const info=document.createElement('button');
        info.style.cssText='border:0;background:transparent;text-align:left;padding:0;min-width:0';

        const dt=new Date(item.savedAt);
        const ds=isNaN(dt)?'':dt.toLocaleString('ja-JP',{
          year:'numeric',month:'numeric',day:'numeric',
          hour:'2-digit',minute:'2-digit'
        });

        info.innerHTML=
          `<div class="savedItemName">${String(item.name||'名称なし').replace(/</g,'&lt;')}</div>`+
          `<div class="savedItemDate">${ds}</div>`;

        const rename=document.createElement('button');
        rename.className='renameSavedBtn';
        rename.textContent='名前変更';

        const del=document.createElement('button');
        del.className='renameSavedBtn';
        del.textContent='削除';

        info.addEventListener('click',()=>{
          selectedId=item.id;
          [...box.querySelectorAll('.savedItem')].forEach(x=>x.classList.remove('active'));
          row.classList.add('active');
          renderPreview(item);
          use.disabled=false;
        });

        rename.addEventListener('click',e=>{
          e.stopPropagation();
          const next=prompt('新しい保存名を入力してください',item.name||'');
          if(!next || !next.trim()) return;

          const current=readSaved();
          const idx=current.findIndex(x=>x.id===item.id);
          if(idx>=0){
            current[idx].name=next.trim();
            writeSaved(current);
            openSavedList();
          }
        });

        del.addEventListener('click',e=>{
          e.stopPropagation();
          if(!confirm('この保存を削除しますか？')) return;
          writeSaved(readSaved().filter(x=>x.id!==item.id));
          openSavedList();
        });

        row.append(info,rename,del);
        box.appendChild(row);
      });
    }

    close.onclick=()=>overlay.classList.remove('show');

    use.onclick=()=>{
      const item=readSaved().find(x=>x.id===selectedId);
      if(!item) return;

      used=item.used.slice();
      target=item.target.slice();
      placed=item.placed.slice();
      roster=item.roster.slice();
      window.memberLabels={...(item.memberLabels||{})};

      history=[];
      window.__seatRedoStack=[];

      $('setup')?.classList.add('hide');
      $('rosterScreen')?.classList.add('hide');
      $('work')?.classList.remove('hide');

      overlay.classList.remove('show');

      renderSeats();
      updateStatus();
      enableHistoryButtons();

      if(typeof flashStatus==='function') flashStatus('保存した座席を呼び出しました','good');
    };

    overlay.classList.add('show');
  }

  ['openSavedV101','openSavedV10','openSavedBrowser'].forEach(id=>{
    const old=$(id);
    if(!old) return;
    const n=old.cloneNode(true);
    old.replaceWith(n);
    n.disabled=false;
    n.addEventListener('click',openSavedList);
  });

  enableHistoryButtons();
})();
</script>


<script>
(function(){
  const $=id=>document.getElementById(id);

  function getPairsStrict(){
    if(typeof window.getSeatConsiderPairs==='function'){
      return window.getSeatConsiderPairs()
        .filter(p=>p && p.a && p.b && String(p.a)!==String(p.b))
        .map(p=>({a:String(p.a),b:String(p.b)}));
    }
    return [];
  }

  function relation(a,b){
    if(a<0||b<0) return null;
    const ar=Math.floor(a/COLS), ac=a%COLS;
    const br=Math.floor(b/COLS), bc=b%COLS;
    const dr=Math.abs(ar-br), dc=Math.abs(ac-bc);
    if(dr===0 && dc===1) return 'side';
    if(dr===1 && dc===0) return 'front';
    if(dr===1 && dc===1) return 'diag';
    return null;
  }

  function conflictPriority(type){
    if(type==='side') return 3;
    if(type==='front') return 2;
    if(type==='diag') return 1;
    return 0;
  }

  function seatConflictLevel(num,seat){
    const pairs=getPairsStrict();
    let level=0;

    for(const p of pairs){
      const n=String(num);
      if(n!==p.a && n!==p.b) continue;

      const other=n===p.a ? p.b : p.a;
      const otherSeat=placed.findIndex(x=>String(x)===other);
      if(otherSeat<0) continue;

      const type=relation(seat,otherSeat);
      level=Math.max(level,conflictPriority(type));
    }

    return level;
  }

  function availableSeatsStrict(){
    const out=[];
    for(let i=0;i<TOTAL;i++){
      if(used[i] && target[i] && !placed[i]) out.push(i);
    }
    return out;
  }

  function shuffleStrict(a){
    const x=a.slice();
    for(let i=x.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [x[i],x[j]]=[x[j],x[i]];
    }
    return x;
  }

  // Single draw:
  // 1) absolutely prefer seats with NO adjacency to already-placed consideration partner
  // 2) if impossible, allow diagonal
  // 3) then front/back
  // 4) left/right only as final fallback
  const old=$('placeOne');
  if(old){
    const n=old.cloneNode(true);
    old.replaceWith(n);

    n.onclick=async()=>{
      let val=($('oneNum')?.value||'').trim();
      if(!val) return flashStatus('番号を入力してください。','bad');

      const labels=window.memberLabels||{};
      for(const [id,label] of Object.entries(labels)){
        if(String(label).trim()===val) val=String(id);
      }

      if(!Array.isArray(roster)||!roster.map(String).includes(String(val))){
        $('oneNum').value='';
        return flashStatus('使用しない番号です。','bad');
      }

      if(placed.some(x=>String(x)===String(val))){
        $('oneNum').value='';
        return flashStatus('この番号はすでに配置されています。','bad');
      }

      const seats=availableSeatsStrict();
      if(!seats.length){
        $('oneNum').value='';
        return flashStatus('抽選対象の空席がありません。','bad');
      }

      // Group seats by conflict level.
      // level 0 = no adjacency at all
      const groups={0:[],1:[],2:[],3:[]};
      seats.forEach(seat=>{
        groups[seatConflictLevel(String(val),seat)].push(seat);
      });

      let candidates=[];
      if(groups[0].length) candidates=groups[0];
      else if(groups[1].length) candidates=groups[1];
      else if(groups[2].length) candidates=groups[2];
      else candidates=groups[3];

      const chosen=shuffleStrict(candidates)[0];

      const before=placed.slice();
      const run=++window.__seatDrawRun;
      $('oneNum').value='';
      n.disabled=true;

      try{
        const el=document.querySelectorAll('#seatGrid .desk')[chosen];
        const ok=await window.flyTicketToSeat(String(val),el);

        if(ok && run===window.__seatDrawRun){
          placed[chosen]=String(val);
          history.push({snapshot:before});
          if(window.__seatRedoStack) window.__seatRedoStack=[];
          renderSeats();
          updateStatus();
        }
      }finally{
        n.disabled=false;
      }
    };
  }

  // Bulk placement:
  // evaluate full plans, but reject any plan containing a higher-priority conflict
  // whenever a lower-conflict plan is found.
  function arrangementPenalty(arr){
    let side=0,front=0,diag=0;

    for(const p of getPairsStrict()){
      const ai=arr.findIndex(x=>String(x)===p.a);
      const bi=arr.findIndex(x=>String(x)===p.b);
      if(ai<0||bi<0) continue;

      const t=relation(ai,bi);
      if(t==='side') side++;
      else if(t==='front') front++;
      else if(t==='diag') diag++;
    }

    // Lexicographic priority: side first, then front, then diagonal.
    return side*1000000 + front*1000 + diag;
  }

  function buildBestPlan(nums,seats,randomizeNums){
    let best=null;
    let bestPenalty=Infinity;

    for(let attempt=0;attempt<20000;attempt++){
      const ss=shuffleStrict(seats);
      const ns=randomizeNums ? shuffleStrict(nums) : nums.slice();

      const test=placed.slice();
      ns.forEach((num,k)=>test[ss[k]]=num);

      const penalty=arrangementPenalty(test);

      if(penalty<bestPenalty){
        bestPenalty=penalty;
        best={seatOrder:ss.slice(),numOrder:ns.slice(),penalty};
        if(penalty===0) break;
      }
    }
    return best;
  }

  async function runBulk(mode,btn){
    const run=++window.__seatDrawRun;
    const taken=new Set(placed.filter(Boolean).map(String));
    let nums=roster.map(String).filter(x=>!taken.has(String(x)));
    const seats=availableSeatsStrict();

    if(!seats.length) return flashStatus('抽選対象の空席がありません。','bad');
    if(nums.length<seats.length) return flashStatus(`残り ${nums.length}人 ／ 対象 ${seats.length}席`,'bad');

    nums.sort((a,b)=>{
      const na=Number(a),nb=Number(b);
      if(Number.isFinite(na)&&Number.isFinite(nb)) return na-nb;
      return String(a).localeCompare(String(b),'ja');
    });
    nums=nums.slice(0,seats.length);

    const plan=buildBestPlan(nums,seats,mode==='random');
    if(!plan) return;

    const before=placed.slice();
    btn.disabled=true;

    try{
      for(let k=0;k<plan.numOrder.length;k++){
        if(run!==window.__seatDrawRun) break;

        const num=plan.numOrder[k];
        const idx=plan.seatOrder[k];
        const el=document.querySelectorAll('#seatGrid .desk')[idx];

        const ok=await window.flyTicketToSeat(num,el);
        if(!ok || run!==window.__seatDrawRun) break;

        placed[idx]=num;
        renderSeats();
      }

      if(run===window.__seatDrawRun){
        history.push({snapshot:before});
        if(window.__seatRedoStack) window.__seatRedoStack=[];
        updateStatus();

        if(plan.penalty===0){
          flashStatus('配慮条件を守って配置しました','good');
        }else{
          flashStatus('配置可能な範囲で配慮しました','good');
        }
      }
    }finally{
      btn.disabled=false;
    }
  }

  const ordered=$('orderedRestV101');
  if(ordered){
    const n=ordered.cloneNode(true);
    ordered.replaceWith(n);
    n.onclick=()=>runBulk('ordered',n);
  }

  const random=$('randomRestV101');
  if(random){
    const n=random.cloneNode(true);
    random.replaceWith(n);
    n.onclick=()=>runBulk('random',n);
  }
})();
</script>


<script>
(function(){
  const $=id=>document.getElementById(id);

  // =========================================================
  // 配慮設定：保存済みの組み合わせを自動表示
  // =========================================================
  const PAIR_KEY='seatConsiderPairsV3';

  function loadPairs(){
    try{
      const v=JSON.parse(localStorage.getItem(PAIR_KEY)||'[]');
      return Array.isArray(v)?v:[];
    }catch(e){ return []; }
  }

  function currentMembersForPairs(){
    const out=[];
    const rows=[...document.querySelectorAll('#memberRows2 .memberRow')];
    rows.forEach(r=>{
      const ins=r.querySelectorAll('input');
      const id=(ins[0]?.value||'').trim();
      const label=(ins[1]?.value||'').trim();
      if(id) out.push({id,label:label||id});
    });

    if(!out.length && Array.isArray(roster)){
      roster.forEach(id=>{
        const k=String(id);
        out.push({id:k,label:window.memberLabels?.[k]||k});
      });
    }
    return out;
  }

  function renderSavedPairsAlways(){
    const box=$('considerPairs2');
    if(!box) return;

    const pairs=loadPairs();
    const members=currentMembersForPairs();
    box.innerHTML='';

    if(!pairs.length){
      const empty=document.createElement('div');
      empty.style.cssText='font-size:10px;color:#94a3b8;padding:3px';
      empty.textContent='設定なし';
      box.appendChild(empty);
      return;
    }

    pairs.forEach((p,index)=>{
      const row=document.createElement('div');
      row.className='considerPairRow2';

      const a=document.createElement('select');
      const b=document.createElement('select');
      const sep=document.createElement('span');
      const del=document.createElement('button');

      function fill(sel,value){
        sel.innerHTML='<option value="">選択</option>';
        members.forEach(m=>{
          const op=document.createElement('option');
          op.value=m.id;
          op.textContent=m.label;
          if(String(value||'')===String(m.id)) op.selected=true;
          sel.appendChild(op);
        });
      }

      fill(a,p.a);
      fill(b,p.b);
      sep.textContent='×';
      sep.style.textAlign='center';
      del.textContent='×';
      del.type='button';

      a.addEventListener('change',()=>{
        const x=loadPairs();
        if(!x[index]) x[index]={a:'',b:''};
        x[index].a=a.value;
        localStorage.setItem(PAIR_KEY,JSON.stringify(x));
      });
      b.addEventListener('change',()=>{
        const x=loadPairs();
        if(!x[index]) x[index]={a:'',b:''};
        x[index].b=b.value;
        localStorage.setItem(PAIR_KEY,JSON.stringify(x));
      });
      del.addEventListener('click',()=>{
        const x=loadPairs();
        x.splice(index,1);
        localStorage.setItem(PAIR_KEY,JSON.stringify(x));
        renderSavedPairsAlways();
      });

      row.append(a,sep,b,del);
      box.appendChild(row);
    });
  }

  const prefBtn=$('hiddenPrefBtn');
  const prefPanel=$('hiddenPrefPanel');
  if(prefBtn && prefPanel){
    const n=prefBtn.cloneNode(true);
    prefBtn.replaceWith(n);
    n.addEventListener('click',()=>{
      prefPanel.style.display=prefPanel.style.display==='none'?'block':'none';
      if(prefPanel.style.display==='block') renderSavedPairsAlways();
    });
  }

  // Roster/member screen opening automatically refreshes saved pair display.
  document.addEventListener('click',e=>{
    if(e.target?.id==='goWork' || e.target?.id==='changeMembers2'){
      setTimeout(renderSavedPairsAlways,60);
    }
  });

  // If the panel is already open, refresh immediately.
  setTimeout(()=>{
    if(prefPanel && prefPanel.style.display!=='none'){
      renderSavedPairsAlways();
    }
  },100);

  // =========================================================
  // アプリ保存：完全に一本化
  // =========================================================
  const SAVE_KEY='seatAppLayoutsFinalV3';

  function readLayouts(){
    try{
      const v=JSON.parse(localStorage.getItem(SAVE_KEY)||'[]');
      return Array.isArray(v)?v:[];
    }catch(e){ return []; }
  }

  function writeLayouts(v){
    localStorage.setItem(SAVE_KEY,JSON.stringify(v));
  }

  function saveCurrentSeat(){
    const name=prompt('保存名を入力してください');
    if(!name || !name.trim()) return;

    const item={
      id:Date.now()+'_'+Math.random().toString(16).slice(2),
      name:name.trim(),
      savedAt:new Date().toISOString(),
      used:Array.isArray(used)?used.slice():[],
      target:Array.isArray(target)?target.slice():[],
      placed:Array.isArray(placed)?placed.slice():[],
      roster:Array.isArray(roster)?roster.slice():[],
      memberLabels:{...(window.memberLabels||{})}
    };

    const list=readLayouts();
    list.push(item);
    writeLayouts(list);

    // verify immediately that it actually exists in storage
    const verify=readLayouts().some(x=>x.id===item.id);

    if(typeof flashStatus==='function'){
      flashStatus(
        verify ? `「${item.name}」をアプリ保存しました` : '保存に失敗しました',
        verify ? 'good' : 'bad'
      );
    }else{
      alert(verify ? `「${item.name}」をアプリ保存しました` : '保存に失敗しました');
    }
  }

  // Replace every possible app-save button after all earlier scripts.
  ['saveAppV101','saveAppV10','saveApp'].forEach(id=>{
    const old=$(id);
    if(!old) return;
    const n=old.cloneNode(true);
    old.replaceWith(n);
    n.disabled=false;
    n.addEventListener('click',saveCurrentSeat);
  });

  function previewLayout(item){
    const title=$('savedPreviewTitle');
    const grid=$('savedPreviewGrid');
    if(!title||!grid) return;

    title.textContent=item.name||'保存した座席';
    grid.innerHTML='';

    for(let i=0;i<TOTAL;i++){
      const d=document.createElement('div');
      d.className='desk '+(item.used?.[i]?'':'off');

      const num=item.placed?.[i] ? String(item.placed[i]) : '';
      d.textContent=num ? (item.memberLabels?.[num]||num) : '';

      grid.appendChild(d);
    }
  }

  function openSavedLayouts(){
    const list=readLayouts();
    const overlay=$('savedOverlay');
    const box=$('savedBrowserList');
    const use=$('savedUse');
    const close=$('savedClose');
    const title=$('savedPreviewTitle');
    const grid=$('savedPreviewGrid');

    if(!overlay||!box||!use||!close||!title||!grid) return;

    let selectedId=null;
    box.innerHTML='';
    title.textContent='座席を選択';
    grid.innerHTML='';
    use.disabled=true;

    if(!list.length){
      box.innerHTML='<div style="padding:8px;font-size:12px;color:#64748b">保存した座席はありません。</div>';
    }else{
      list.slice().reverse().forEach(item=>{
        const row=document.createElement('div');
        row.className='savedItem';

        const info=document.createElement('button');
        info.style.cssText='border:0;background:transparent;text-align:left;padding:0;min-width:0';

        const dt=new Date(item.savedAt);
        const ds=isNaN(dt)?'':dt.toLocaleString('ja-JP',{
          year:'numeric',month:'numeric',day:'numeric',
          hour:'2-digit',minute:'2-digit'
        });

        info.innerHTML=
          `<div class="savedItemName">${String(item.name||'名称なし').replace(/</g,'&lt;')}</div>`+
          `<div class="savedItemDate">${ds}</div>`;

        const rename=document.createElement('button');
        rename.className='renameSavedBtn';
        rename.textContent='名前変更';

        const del=document.createElement('button');
        del.className='renameSavedBtn';
        del.textContent='削除';

        info.addEventListener('click',()=>{
          selectedId=item.id;
          [...box.querySelectorAll('.savedItem')].forEach(x=>x.classList.remove('active'));
          row.classList.add('active');
          previewLayout(item);
          use.disabled=false;
        });

        rename.addEventListener('click',e=>{
          e.stopPropagation();
          const newName=prompt('新しい保存名を入力してください',item.name||'');
          if(!newName || !newName.trim()) return;

          const current=readLayouts();
          const idx=current.findIndex(x=>x.id===item.id);
          if(idx>=0){
            current[idx].name=newName.trim();
            writeLayouts(current);
            openSavedLayouts();
          }
        });

        del.addEventListener('click',e=>{
          e.stopPropagation();
          if(!confirm('この保存を削除しますか？')) return;
          writeLayouts(readLayouts().filter(x=>x.id!==item.id));
          openSavedLayouts();
        });

        row.append(info,rename,del);
        box.appendChild(row);
      });
    }

    close.onclick=()=>overlay.classList.remove('show');

    use.onclick=()=>{
      const item=readLayouts().find(x=>x.id===selectedId);
      if(!item) return;

      used=item.used.slice();
      target=item.target.slice();
      placed=item.placed.slice();
      roster=item.roster.slice();
      window.memberLabels={...(item.memberLabels||{})};
      history=[];
      if(window.__seatRedoStack) window.__seatRedoStack=[];

      $('setup')?.classList.add('hide');
      $('rosterScreen')?.classList.add('hide');
      $('work')?.classList.remove('hide');

      overlay.classList.remove('show');
      renderSeats();
      updateStatus();

      if(typeof flashStatus==='function') flashStatus('保存した座席を呼び出しました','good');
    };

    overlay.classList.add('show');
  }

  ['openSavedV101','openSavedV10','openSavedBrowser'].forEach(id=>{
    const old=$(id);
    if(!old) return;
    const n=old.cloneNode(true);
    old.replaceWith(n);
    n.disabled=false;
    n.addEventListener('click',openSavedLayouts);
  });
})();
</script>


<script>
(function(){
  const $=id=>document.getElementById(id);

  // ---------------------------------------------------------
  // 最終版 配慮ロジック
  // 保存先が過去バージョンで分かれていても全て読み取る
  // ---------------------------------------------------------
  function getAllConsiderPairs(){
    const result=[];
    const seen=new Set();

    function add(a,b){
      a=String(a||'').trim();
      b=String(b||'').trim();
      if(!a||!b||a===b) return;
      const key=[a,b].sort().join('|||');
      if(seen.has(key)) return;
      seen.add(key);
      result.push({a,b});
    }

    // 画面上の現在値を最優先
    document.querySelectorAll('#considerPairs2 .considerPairRow2').forEach(row=>{
      const s=row.querySelectorAll('select');
      add(s[0]?.value,s[1]?.value);
    });

    // 過去に使った保存キーも全部読む
    ['seatConsiderPairsV3','seatConsiderPairsV2','seatConsiderPairs'].forEach(key=>{
      try{
        const arr=JSON.parse(localStorage.getItem(key)||'[]');
        if(Array.isArray(arr)) arr.forEach(p=>add(p?.a,p?.b));
      }catch(e){}
    });

    return result;
  }

  function relation(a,b){
    const ar=Math.floor(a/COLS), ac=a%COLS;
    const br=Math.floor(b/COLS), bc=b%COLS;
    const dr=Math.abs(ar-br), dc=Math.abs(ac-bc);

    if(dr===0 && dc===1) return 'side';   // 左右
    if(dr===1 && dc===0) return 'front';  // 前後
    if(dr===1 && dc===1) return 'diag';   // 斜め
    return null;
  }

  function shuffleX(arr){
    const a=arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [a[i],a[j]]=[a[j],a[i]];
    }
    return a;
  }

  function freeSeats(){
    const a=[];
    for(let i=0;i<TOTAL;i++){
      if(used[i] && target[i] && !placed[i]) a.push(i);
    }
    return a;
  }

  function remainingStudents(){
    const taken=new Set(placed.filter(Boolean).map(String));
    return roster.map(String).filter(x=>!taken.has(String(x)));
  }

  function pairMap(){
    const m=new Map();
    getAllConsiderPairs().forEach(p=>{
      if(!m.has(p.a)) m.set(p.a,new Set());
      if(!m.has(p.b)) m.set(p.b,new Set());
      m.get(p.a).add(p.b);
      m.get(p.b).add(p.a);
    });
    return m;
  }

  function existingSeatMap(base){
    const m=new Map();
    base.forEach((v,i)=>{
      if(v!=='' && v!=null) m.set(String(v),i);
    });
    return m;
  }

  // 「左右・前後・斜めのどれにも接しない」配置が存在するなら必ず探す。
  function solveZeroConflict(basePlaced, seats, students){
    const partners=pairMap();
    const baseSeat=existingSeatMap(basePlaced);
    const studentSet=new Set(students.map(String));

    // すでに両方配置済みの組が隣接している場合は、未来では修正不能
    for(const p of getAllConsiderPairs()){
      if(baseSeat.has(p.a) && baseSeat.has(p.b)){
        if(relation(baseSeat.get(p.a),baseSeat.get(p.b))) return null;
      }
    }

    // 未配置のうち、配慮対象になっている人だけを解く
    const constrained=[...studentSet]
      .filter(id=>partners.has(id))
      .sort((a,b)=>(partners.get(b)?.size||0)-(partners.get(a)?.size||0));

    const assigned=new Map();
    const usedSeat=new Set();

    function allowed(id,seat){
      for(const other of partners.get(id)||[]){
        let os=null;
        if(baseSeat.has(other)) os=baseSeat.get(other);
        else if(assigned.has(other)) os=assigned.get(other);
        if(os!=null && relation(seat,os)) return false;
      }
      return true;
    }

    function dfs(pos){
      if(pos>=constrained.length) return true;

      const id=constrained[pos];
      // 候補をランダム化して、毎回同じ配置にならないようにする
      const opts=shuffleX(seats.filter(s=>!usedSeat.has(s) && allowed(id,s)));

      for(const seat of opts){
        assigned.set(id,seat);
        usedSeat.add(seat);
        if(dfs(pos+1)) return true;
        assigned.delete(id);
        usedSeat.delete(seat);
      }
      return false;
    }

    if(!dfs(0)) return null;
    return Object.fromEntries(assigned);
  }

  // 0衝突が不可能な場合だけ使う評価。
  // 左右を最も重く、次に前後、最後に斜め。
  function penalty(arr){
    let side=0,front=0,diag=0;
    for(const p of getAllConsiderPairs()){
      const a=arr.findIndex(x=>String(x)===p.a);
      const b=arr.findIndex(x=>String(x)===p.b);
      if(a<0||b<0) continue;
      const r=relation(a,b);
      if(r==='side') side++;
      else if(r==='front') front++;
      else if(r==='diag') diag++;
    }
    return side*1000000 + front*1000 + diag;
  }

  function bestFallbackPlan(basePlaced,seats,students,tries=12000){
    let best=null,bestP=Infinity;
    for(let t=0;t<tries;t++){
      const ss=shuffleX(seats);
      const ns=shuffleX(students);
      const test=basePlaced.slice();
      ns.forEach((n,k)=>test[ss[k]]=n);
      const p=penalty(test);
      if(p<bestP){
        bestP=p;
        best={seatOrder:ss,numOrder:ns,penalty:p};
        if(p===0) break;
      }
    }
    return best;
  }

  // ---------------------------------------------------------
  // 単発抽選
  // ---------------------------------------------------------
  const oldOne=$('placeOne');
  if(oldOne){
    const one=oldOne.cloneNode(true);
    oldOne.replaceWith(one);

    one.onclick=async()=>{
      let val=($('oneNum')?.value||'').trim();
      if(!val) return flashStatus('番号を入力してください。','bad');

      for(const [id,label] of Object.entries(window.memberLabels||{})){
        if(String(label).trim()===val) val=String(id);
      }

      if(!Array.isArray(roster)||!roster.map(String).includes(String(val))){
        $('oneNum').value='';
        return flashStatus('使用しない番号です。','bad');
      }
      if(placed.some(x=>String(x)===String(val))){
        $('oneNum').value='';
        return flashStatus('この番号はすでに配置されています。','bad');
      }

      const seats=freeSeats();
      if(!seats.length){
        $('oneNum').value='';
        return flashStatus('抽選対象の空席がありません。','bad');
      }

      // 各候補席について、その後の残り全員も0衝突で置けるか確認
      const zeroCandidates=[];
      for(const seat of shuffleX(seats)){
        const base=placed.slice();
        base[seat]=String(val);

        const restSeats=seats.filter(s=>s!==seat);
        const restStudents=remainingStudents().filter(x=>String(x)!==String(val));

        const solved=solveZeroConflict(base,restSeats,restStudents);
        if(solved!==null) zeroCandidates.push(seat);
      }

      let chosen;
      if(zeroCandidates.length){
        chosen=shuffleX(zeroCandidates)[0];
      }else{
        // 本当に0衝突の完成形がない場合だけ優先順位付きで妥協
        let bestSeat=seats[0],bestScore=Infinity;
        for(const seat of seats){
          const base=placed.slice();
          base[seat]=String(val);
          const restSeats=seats.filter(s=>s!==seat);
          const restStudents=remainingStudents().filter(x=>String(x)!==String(val));
          const fb=bestFallbackPlan(base,restSeats,restStudents,2500);
          const sc=fb ? fb.penalty : penalty(base);
          if(sc<bestScore){
            bestScore=sc;
            bestSeat=seat;
          }
        }
        chosen=bestSeat;
      }

      const before=placed.slice();
      const run=++window.__seatDrawRun;
      $('oneNum').value='';
      one.disabled=true;

      try{
        const el=document.querySelectorAll('#seatGrid .desk')[chosen];
        const ok=await window.flyTicketToSeat(String(val),el);

        if(ok && run===window.__seatDrawRun){
          placed[chosen]=String(val);
          history.push({snapshot:before});
          if(window.__seatRedoStack) window.__seatRedoStack=[];
          renderSeats();
          updateStatus();
        }
      }finally{
        one.disabled=false;
      }
    };
  }

  // ---------------------------------------------------------
  // 残り全て / ランダム
  // 最初に完成配置を決め、その後アニメーションだけ順番に見せる
  // ---------------------------------------------------------
  async function bulk(mode,btn){
    const run=++window.__seatDrawRun;
    let nums=remainingStudents();
    const seats=freeSeats();

    if(!seats.length) return flashStatus('抽選対象の空席がありません。','bad');
    if(nums.length<seats.length) return flashStatus(`残り ${nums.length}人 ／ 対象 ${seats.length}席`,'bad');

    nums.sort((a,b)=>{
      const na=Number(a),nb=Number(b);
      if(Number.isFinite(na)&&Number.isFinite(nb)) return na-nb;
      return String(a).localeCompare(String(b),'ja');
    });
    nums=nums.slice(0,seats.length);

    const zero=solveZeroConflict(placed.slice(),seats,nums);
    let seatByNum={};
    let strict=zero!==null;

    if(strict){
      seatByNum={...zero};

      const usedSolved=new Set(Object.values(seatByNum).map(Number));
      const open=shuffleX(seats.filter(s=>!usedSolved.has(s)));
      const loose=nums.filter(n=>seatByNum[n]==null);
      loose.forEach((n,i)=>seatByNum[n]=open[i]);
    }else{
      // 0衝突が数学的に作れないときだけ妥協
      const fb=bestFallbackPlan(placed.slice(),seats,nums,16000);
      if(!fb) return;
      fb.numOrder.forEach((n,i)=>seatByNum[n]=fb.seatOrder[i]);
    }

    // 表示順のみ変更。席そのものはすでに決定済み。
    let reveal = mode==='random' ? shuffleX(nums) : nums.slice();

    const before=placed.slice();
    btn.disabled=true;

    try{
      let any=false;
      for(const num of reveal){
        if(run!==window.__seatDrawRun) break;
        const idx=seatByNum[num];
        const el=document.querySelectorAll('#seatGrid .desk')[idx];
        const ok=await window.flyTicketToSeat(num,el);
        if(!ok || run!==window.__seatDrawRun) break;

        placed[idx]=num;
        renderSeats();
        any=true;
      }

      if(any && run===window.__seatDrawRun){
        history.push({snapshot:before});
        if(window.__seatRedoStack) window.__seatRedoStack=[];
        updateStatus();
        flashStatus(
          strict ? '配慮条件を守って配置しました' : '配置可能な範囲で配慮しました',
          'good'
        );
      }
    }finally{
      btn.disabled=false;
    }
  }

  const oldOrdered=$('orderedRestV101');
  if(oldOrdered){
    const b=oldOrdered.cloneNode(true);
    oldOrdered.replaceWith(b);
    b.onclick=()=>bulk('ordered',b);
  }

  const oldRandom=$('randomRestV101');
  if(oldRandom){
    const b=oldRandom.cloneNode(true);
    oldRandom.replaceWith(b);
    b.onclick=()=>bulk('random',b);
  }
})();
</script>


<script>
(function(){
  const $=id=>document.getElementById(id);

  function roundRect(ctx,x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  async function buildA4Canvas(titleText, boardBottom=false){
    const W=3508,H=2480;
    const c=document.createElement('canvas');
    c.width=W;c.height=H;
    const ctx=c.getContext('2d');

    ctx.fillStyle='#fff';
    ctx.fillRect(0,0,W,H);

    ctx.fillStyle='#000';
    ctx.textAlign='center';
    ctx.font='700 92px sans-serif';
    ctx.fillText(titleText,W/2,120);

    const boardX=300;
    const boardW=W-600;
    const boardH=115;
    const boardY=boardBottom ? H-290 : 175;

    ctx.strokeStyle='#000';
    ctx.lineWidth=7;
    ctx.strokeRect(boardX,boardY,boardW,boardH);
    ctx.font='700 48px sans-serif';
    ctx.fillText('黒　板',W/2,boardY+73);

    const left=220, right=220;
    const top=boardBottom ? 250 : 345;
    const bottom=boardBottom ? 360 : 170;
    const gridW=W-left-right;
    const gridH=H-top-bottom;
    const cw=gridW/COLS;
    const ch=gridH/ROWS;

    for(let r=0;r<ROWS;r++){
      for(let col=0;col<COLS;col++){
        const srcIndex=r*COLS+col;
        if(!used[srcIndex]) continue;

        // boardBottomでは座席位置だけ点対称にする
        const rr=boardBottom ? (ROWS-1-r) : r;
        const cc=boardBottom ? (COLS-1-col) : col;

        const x=left+cc*cw+16;
        const y=top+rr*ch+14;
        const w=cw-32;
        const h=ch-28;

        ctx.strokeStyle='#000';
        ctx.lineWidth=4;
        roundRect(ctx,x,y,w,h,18);
        ctx.stroke();

        const num=placed[srcIndex] ? String(placed[srcIndex]) : '';
        if(!num) continue;

        const name=(window.memberLabels?.[num] || num);

        // 文字は回転させず、常に読みやすい向き
        ctx.fillStyle='#000';
        ctx.textAlign='center';
        ctx.font='600 34px sans-serif';
        ctx.fillText(num,x+w/2,y+42);

        let fs=60;
        if(String(name).length>=6) fs=50;
        if(String(name).length>=9) fs=42;

        ctx.font=`700 ${fs}px sans-serif`;
        const maxWidth=w-24;
        while(ctx.measureText(String(name)).width>maxWidth && fs>30){
          fs-=2;
          ctx.font=`700 ${fs}px sans-serif`;
        }
        ctx.fillText(String(name),x+w/2,y+h/2+24);
      }
    }

    ctx.font='400 24px sans-serif';
    ctx.fillStyle='#666';
    ctx.fillText(new Date().toLocaleString('ja-JP'),W/2,H-45);

    return c;
  }

  async function saveVersion(boardBottom){
    const base=prompt(boardBottom
      ? '黒板が下の画像ファイル名を入力してください'
      : '画像ファイル名を入力してください');
    if(!base || !base.trim()) return;

    const canvas=await buildA4Canvas(base.trim(),boardBottom);
    const a=document.createElement('a');
    const suffix=boardBottom ? '_黒板下_A4横.png' : '_黒板上_A4横.png';
    a.download=base.trim().replace(/[\\/:*?"<>|]/g,'_')+suffix;
    a.href=canvas.toDataURL('image/png');
    a.click();
  }

  // 既存の画像保存ボタンを、押したら2択にする
  ['saveImageV101','saveImageV10','savePng'].forEach(id=>{
    const old=$(id);
    if(!old) return;
    const n=old.cloneNode(true);
    old.replaceWith(n);
    n.addEventListener('click',()=>{
      const choice=confirm('黒板が下のバージョンで保存しますか？\n\nOK：黒板が下\nキャンセル：黒板が上');
      saveVersion(choice);
    });
  });
})();
</script>


<script>
(function(){
  const $=id=>document.getElementById(id);

  function safeName(s){
    return String(s||'席替え結果').trim().replace(/[\\/:*?"<>|]/g,'_') || '席替え結果';
  }

  async function canvasToBlob(canvas){
    return await new Promise((resolve,reject)=>{
      canvas.toBlob(blob=>{
        if(blob) resolve(blob);
        else reject(new Error('画像の作成に失敗しました'));
      },'image/png');
    });
  }

  async function saveBlobWithPicker(blob, filename){
    if(typeof window.showSaveFilePicker==='function'){
      try{
        const handle=await window.showSaveFilePicker({
          suggestedName:filename,
          types:[{
            description:'PNG画像',
            accept:{'image/png':['.png']}
          }]
        });
        const writable=await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        return 'picker';
      }catch(err){
        if(err && err.name==='AbortError') return 'cancel';
      }
    }

    try{
      const file=new File([blob],filename,{type:'image/png'});
      if(navigator.share && (!navigator.canShare || navigator.canShare({files:[file]}))){
        await navigator.share({
          files:[file],
          title:filename
        });
        return 'share';
      }
    }catch(err){
      if(err && err.name==='AbortError') return 'cancel';
    }

    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download=filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1500);
    return 'download';
  }

  async function saveA4FromApp(boardBottom){
    const raw=prompt(
      boardBottom
        ? '黒板が下の画像ファイル名を入力してください'
        : '黒板が上の画像ファイル名を入力してください',
      '席替え結果'
    );
    if(!raw || !raw.trim()) return;

    try{
      const canvas=await buildA4Canvas(raw.trim(),boardBottom);
      const suffix=boardBottom ? '_黒板下_A4横.png' : '_黒板上_A4横.png';
      const filename=safeName(raw)+suffix;
      const blob=await canvasToBlob(canvas);
      const result=await saveBlobWithPicker(blob,filename);

      if(result==='picker'){
        if(typeof flashStatus==='function') flashStatus('保存先を指定して画像を保存しました','good');
      }else if(result==='share'){
        if(typeof flashStatus==='function') flashStatus('共有画面から「ファイルに保存」を選べます','good');
      }else if(result==='download'){
        if(typeof flashStatus==='function') flashStatus('画像ファイルとして保存しました','good');
      }
    }catch(err){
      console.error(err);
      if(typeof flashStatus==='function') flashStatus('画像保存に失敗しました','bad');
      else alert('画像保存に失敗しました');
    }
  }

  ['saveImageV101','saveImageV10','savePng'].forEach(id=>{
    const old=$(id);
    if(!old) return;
    const n=old.cloneNode(true);
    old.replaceWith(n);
    n.disabled=false;
    n.addEventListener('click',()=>{
      const bottom=confirm(
        '黒板が下のバージョンで保存しますか？\n\nOK：黒板が下\nキャンセル：黒板が上'
      );
      saveA4FromApp(bottom);
    });
  });
})();
</script>
