<style>
.drawStage{

<script>
const ROWS=7,COLS=6,TOTAL=42,A4W=3508,A4H=2480;
const setupGrid=document.getElementById('setupGrid'),seatGrid=document.getElementById('seatGrid'),pill=document.getElementById('pill'),statusBox=document.getElementById('status'),confetti=document.getElementById('confetti');
let used=JSON.parse(localStorage.getItem('seatApp_used')||'null')||Array(TOTAL).fill(true);
let target=Array(TOTAL).fill(true),placed=Array(TOTAL).fill(''),history=[];
function label(i){return `${Math.floor(i/COLS)+1}-${i%COLS+1}`}function sleep(ms){return new Promise(r=>setTimeout(r,ms))}function count(){pill.textContent=`使用席 ${used.filter(Boolean).length} / 42`}
function setStatus(t,w=false){statusBox.textContent=t;statusBox.classList.toggle('warn',w)}
function renderSetup(){setupGrid.innerHTML='';used.forEach((v,i)=>{const b=document.createElement('button');b.className='desk '+(v?'target':'off');b.textContent=v?label(i):'';b.onclick=()=>{used[i]=!used[i];renderSetup()};setupGrid.appendChild(b)});count()}
function renderSeats(high=-1,roulette=-1){seatGrid.innerHTML='';for(let i=0;i<TOTAL;i++){const b=document.createElement('button');let cls='desk ';if(!used[i])cls+='off';else if(placed[i])cls+='filled';else cls+=target[i]?'target':'exclude';if(i===high)cls+=' hit';if(i===roulette)cls+=' roulette';b.className=cls;b.textContent=!used[i]?'':(placed[i]|| (target[i]?'抽選':'×'));b.onclick=()=>toggleTarget(i);seatGrid.appendChild(b)}count()}
function toggleTarget(i){if(!used[i]||placed[i])return;target[i]=!target[i];renderSeats();updateStatus()}
function availableSeats(){return target.map((v,i)=>used[i]&&v&&!placed[i]?i:null).filter(v=>v!==null)}
function placedNums(){return placed.filter(Boolean).map(String)}
function updateStatus(){setStatus(`抽選対象 ${availableSeats().length}席 / 対象外 ${used.filter((v,i)=>v&&!target[i]&&!placed[i]).length}席 / 配置済み ${placedNums().length}人`)}
function parseNums(s){return s.split(/[\s,、，]+/).map(x=>x.trim()).filter(Boolean)}
function duplicateInInput(nums){const seen=new Set();for(const n of nums){if(seen.has(n))return n;seen.add(n)}return null}
function checkDuplicate(nums){const current=new Set(placedNums());for(const n of nums){if(current.has(String(n)))return n}return duplicateInInput(nums)}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function burst(x=innerWidth/2,y=innerHeight/2,big=false){const colors=['#2fd8ff','#ff4f91','#ffcf4d','#43d17a','#fff','#258cff'];for(let i=0;i<(big?130:70);i++){const p=document.createElement('div');p.className='piece';p.style.left=(x+(Math.random()-.5)*(big?900:420))+'px';p.style.top=(y-60-Math.random()*220)+'px';p.style.background=colors[i%colors.length];p.style.animationDelay=Math.random()*.25+'s';confetti.appendChild(p);setTimeout(()=>p.remove(),1600)}const s=document.createElement('div');s.className='spark';s.style.left=x+'px';s.style.top=y+'px';document.body.appendChild(s);setTimeout(()=>s.remove(),650)}
function makeTrail(x1,y1,x2,y2){const dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy);const tr=document.createElement('div');tr.className='trail';tr.style.left=x1+'px';tr.style.top=y1+'px';tr.style.width=len+'px';tr.style.transform=`rotate(${Math.atan2(dy,dx)}rad)`;document.body.appendChild(tr);setTimeout(()=>{tr.style.opacity=0;setTimeout(()=>tr.remove(),320)},540)}
function inputCenter(){const r=document.getElementById('oneNum').getBoundingClientRect();return {x:r.left+r.width/2,y:r.top+r.height/2}}
async function flyNumber(num,idx){const start=inputCenter();const cell=seatGrid.children[idx].getBoundingClientRect();const end={x:cell.left+cell.width/2,y:cell.top+cell.height/2};const f=document.createElement('div');f.className='fly';f.textContent=num;document.body.appendChild(f);f.style.left=start.x-29+'px';f.style.top=start.y-29+'px';makeTrail(start.x,start.y,end.x,end.y);requestAnimationFrame(()=>{f.style.transform=`translate(${end.x-start.x}px,${end.y-start.y}px) scale(.72) rotate(720deg) skew(-10deg)`});await sleep(610);f.style.opacity='0';await sleep(60);f.remove()}
async function place(num,idx){await flyNumber(num,idx);placed[idx]=String(num);history.push({idx,num:String(num)});renderSeats(idx);const r=seatGrid.children[idx].getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,true);await sleep(140);updateStatus()}
function clearInputsUsed(nums){document.getElementById('oneNum').value=''}
function resetForWork(){target=used.map(Boolean);placed=Array(TOTAL).fill('');history=[];renderSeats();updateStatus();renderSavedList()}
document.getElementById('goWork').onclick=()=>{if(!used.some(Boolean)){alert('使用する席を選んでください');return}localStorage.setItem('seatApp_used',JSON.stringify(used));document.getElementById('setup').classList.add('hide');document.getElementById('work').classList.remove('hide');resetForWork();burst(innerWidth/2,innerHeight/2,true)};
document.getElementById('allUse').onclick=()=>{used=Array(TOTAL).fill(true);renderSetup()};document.getElementById('allOff').onclick=()=>{used=Array(TOTAL).fill(false);renderSetup()};document.getElementById('sample').onclick=()=>{used=Array(TOTAL).fill(true);[0,5,36,41].forEach(i=>used[i]=false);renderSetup()};document.getElementById('backSetup').onclick=()=>{document.getElementById('work').classList.add('hide');document.getElementById('setup').classList.remove('hide');renderSetup()};
document.getElementById('selectAll').onclick=()=>{for(let i=0;i<TOTAL;i++)if(used[i]&&!placed[i])target[i]=true;renderSeats();updateStatus()};document.getElementById('clearSelect').onclick=()=>{for(let i=0;i<TOTAL;i++)if(used[i]&&!placed[i])target[i]=false;renderSeats();updateStatus()};document.getElementById('clearPlaced').onclick=()=>{if(!confirm('最初からやり直しますか？'))return;placed=Array(TOTAL).fill('');history=[];target=used.map(Boolean);renderSeats();updateStatus();document.getElementById('oneNum').value=''};
document.getElementById('undoBtn').onclick=()=>{const last=history.pop();if(!last){setStatus('戻せる操作がありません。',true);return}placed[last.idx]='';target[last.idx]=true;renderSeats(last.idx);setStatus(`${last.num}番の配置を1つ戻しました。`)};
document.getElementById('placeOne').onclick=async()=>{const num=document.getElementById('oneNum').value.trim();if(!num){setStatus('名簿番号を入力してください。',true);return}const dup=checkDuplicate([num]);if(dup){setStatus(`${dup}番は入力済みです。`,true);return}const seats=availableSeats();if(!seats.length){setStatus('抽選対象の席がありません。',true);return}const idx=seats.length===1?seats[0]:shuffle([...seats])[0];setStatus(`${num}番が勢いよく飛んでいきます！`);await place(num,idx);clearInputsUsed([num])};
function getLayouts(){return JSON.parse(localStorage.getItem('seatApp_layouts')||'[]')}function setLayouts(v){localStorage.setItem('seatApp_layouts',JSON.stringify(v))}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function renderSavedList(){const box=document.getElementById('savedList');box.innerHTML='';const list=getLayouts();if(!list.length){box.innerHTML='<div class="mini">保存した席はまだありません。</div>';return}list.slice().reverse().forEach(item=>{const row=document.createElement('div');row.className='savedItem';const title=document.createElement('div');title.innerHTML=`<div class="savedName">${esc(item.name)}</div><div class="savedDate">${new Date(item.savedAt).toLocaleString('ja-JP')}</div>`;const load=document.createElement('button');load.className='miniBtn blue';load.textContent='読込';const del=document.createElement('button');del.className='miniBtn pink';del.textContent='削除';load.onclick=()=>{used=item.used;target=item.target;placed=item.placed;history=[];document.getElementById('setup').classList.add('hide');document.getElementById('work').classList.remove('hide');renderSeats();updateStatus();setStatus(`「${item.name}」を読み込みました。`)};del.onclick=()=>{setLayouts(getLayouts().filter(x=>x.id!==item.id));renderSavedList()};row.append(title,load,del);box.appendChild(row)})}
document.getElementById('saveApp').onclick=()=>{const name=document.getElementById('layoutName').value.trim()||`席替え_${new Date().toLocaleDateString('ja-JP')}`;const list=getLayouts();list.push({id:Date.now()+Math.random().toString(16),name,savedAt:new Date().toISOString(),used:[...used],target:[...target],placed:[...placed]});setLayouts(list);renderSavedList();setStatus(`「${name}」を保存しました。`)};
function round(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
document.getElementById('savePng').onclick=()=>{const name=document.getElementById('layoutName').value.trim()||'席替え結果';const c=document.createElement('canvas');c.width=A4W;c.height=A4H;const ctx=c.getContext('2d');const g=ctx.createLinearGradient(0,0,0,A4H);g.addColorStop(0,'#dff6f8');g.addColorStop(.22,'#edfdfa');g.addColorStop(.22,'#f3dfbd');g.addColorStop(1,'#f8e7c9');ctx.fillStyle=g;ctx.fillRect(0,0,A4W,A4H);ctx.fillStyle='rgba(130,86,42,.08)';for(let x=0;x<A4W;x+=180)ctx.fillRect(x,560,8,A4H-560);for(let y=570;y<A4H;y+=180)ctx.fillRect(0,y,A4W,8);ctx.textAlign='center';ctx.fillStyle='#153931';ctx.font='900 112px sans-serif';ctx.fillText(name,A4W/2,170);ctx.font='700 42px sans-serif';ctx.fillStyle='#4c646c';ctx.fillText(new Date().toLocaleString('ja-JP'),A4W/2,240);const rx=300,ry=330,rw=A4W-600,rh=A4H-520;round(ctx,rx,ry,rw,rh,70);ctx.fillStyle='rgba(255,255,255,.72)';ctx.fill();ctx.strokeStyle='rgba(90,70,50,.18)';ctx.lineWidth=10;ctx.stroke();round(ctx,rx+90,ry+70,rw-180,120,24);ctx.fillStyle='#1f5c49';ctx.fill();ctx.fillStyle='#eafff7';ctx.font='900 58px sans-serif';ctx.fillText('黒板',A4W/2,ry+148);const gx=rx+170,gy=ry+250,gw=rw-340,gh=rh-360,gap=26;const cw=(gw-gap*(COLS-1))/COLS,ch=(gh-gap*(ROWS-1))/ROWS;for(let i=0;i<TOTAL;i++){const r=Math.floor(i/COLS),col=i%COLS,x=gx+col*(cw+gap),y=gy+r*(ch+gap);if(!used[i])continue;round(ctx,x,y,cw,ch,26);ctx.fillStyle=placed[i]?'#d9fbff':(target[i]?'#ffbf58':'#a0aab2');ctx.fill();ctx.strokeStyle=placed[i]?'#5abed8':'rgba(80,55,30,.28)';ctx.lineWidth=8;ctx.stroke();ctx.fillStyle=placed[i]?'#12304c':(target[i]?'#50320b':'#44505a');ctx.font=`900 ${placed[i]?82:46}px sans-serif`;ctx.fillText(placed[i]||'×',x+cw/2,y+ch/2+(placed[i]?28:16))}const a=document.createElement('a');a.download=name.replace(/[\\/:*?"<>|]/g,'_')+'_A4横.png';a.href=c.toDataURL('image/png');a.click();setStatus('A4横向きPNGを保存しました。')};
document.getElementById('oneNum').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('placeOne').click()});

document.getElementById('autoRest').onclick=async()=>{let remain=roster.map(String).filter(n=>!usedNums().has(n));let seats=target.map((v,i)=>v&&!placed[i]?i:-1).filter(i=>i>=0);if(remain.length!==seats.length)return flashStatus('残り番号と抽選対象席の数を合わせてください。','bad');for(let i=seats.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[seats[i],seats[j]]=[seats[j],seats[i]]}remain.forEach((n,k)=>placed[seats[k]]=n);history.push({bulk:true,nums:remain.slice(),seats:seats.slice()});renderSeats();flashStatus('残りを一括抽選しました！','good');burst(window.innerWidth*.72,window.innerHeight*.45,70)};
document.getElementById('copyImage').onclick=async()=>{try{const canvas=await html2canvas(document.getElementById('shotArea'),{scale:2,backgroundColor:'#ffffff'});const blob=await new Promise(r=>canvas.toBlob(r,'image/png'));if(navigator.clipboard&&window.ClipboardItem){await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);flashStatus('画像をコピーしました','good')}else{flashStatus('このブラウザでは画像コピー非対応です','bad')}}catch(e){flashStatus('画像コピーに失敗しました','bad')}};

document.getElementById('printA4').onclick=()=>window.print();
renderSetup();renderSavedList();
</script>

<script>
// v6.1 hotfix: roster screen + remaining random placement
(function(){
  const qs=id=>document.getElementById(id);
  function countSeats(){ return (typeof used !== 'undefined' && Array.isArray(used)) ? used.filter(Boolean).length : 0; }
  function showRoster(){
    if(!countSeats()){ alert('使用する席を選んでください'); return; }
    roster=Array.from({length:Math.min(42,countSeats())},(_,i)=>i+1);
    qs('setup').style.display='none'; qs('work').style.display='none'; qs('roster').style.display='block';
    renderRoster();
  }
  // Replace the old next handler even if it was assigned earlier.
  const old=qs('goWork');
  if(old){ const clone=old.cloneNode(true); old.parentNode.replaceChild(clone,old); clone.addEventListener('click',showRoster); }

  // Make roster next always enter work when counts match.
  const next=qs('toWork');
  if(next){ const clone=next.cloneNode(true); next.parentNode.replaceChild(clone,next); clone.addEventListener('click',()=>{
    if(roster.length!==countSeats()){ renderRoster(); return; }
    target=used.map(Boolean); placed=Array(TOTAL).fill(''); history=[];
    qs('roster').style.display='none'; qs('work').style.display='block'; renderSeats(); updateStatus();
  }); }

  // Remaining random placement: use every unplaced roster number and every available target seat.
  const auto=qs('autoRest');
  if(auto){ const clone=auto.cloneNode(true); auto.parentNode.replaceChild(clone,auto); clone.addEventListener('click',()=>{
    const taken=new Set(placed.filter(Boolean).map(String));
    const nums=roster.map(String).filter(n=>!taken.has(n));
    const seats=[];
    for(let i=0;i<TOTAL;i++) if(used[i] && target[i] && !placed[i]) seats.push(i);
    if(nums.length===0) return flashStatus('すべて配置済みです。','good');
    if(nums.length!==seats.length) return flashStatus(`残り ${nums.length}人 ／ 抽選対象 ${seats.length}席`,'bad');
    for(let i=seats.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[seats[i],seats[j]]=[seats[j],seats[i]];}
    const before=placed.slice();
    nums.forEach((n,k)=>placed[seats[k]]=n);
    history.push({snapshot:before}); renderSeats(); updateStatus();
    flashStatus('残りをランダム配置しました！','good');
    try{burst(window.innerWidth*.72,window.innerHeight*.45,90)}catch(e){}
  }); }

  // Undo supports bulk snapshot as well as existing single history.
  const undo=qs('undoBtn');
  if(undo){ const clone=undo.cloneNode(true); undo.parentNode.replaceChild(clone,undo); clone.addEventListener('click',()=>{
    if(!history.length) return flashStatus('戻せる操作がありません。','bad');
    const h=history.pop();
    if(h && h.snapshot){ placed=h.snapshot.slice(); }
    else if(h && typeof h.idx==='number'){ placed[h.idx]=''; }
    else if(h && h.seats){ h.seats.forEach(i=>placed[i]=''); }
    renderSeats(); updateStatus();
  }); }
})();
</script>

(function(){

 function init(){members=Array.from({length:seatN()},(_,i)=>({id:String(i+1),label:String(i+1),on:true}));draw()}

 // hard replace first screen next

 $('rosterNext2').onclick=()=>{if(sel().length!==seatN())return;roster=sel().map(m=>m.id);window.memberLabels={};sel().forEach(m=>window.memberLabels[m.id]=m.label||m.id);target=used.map(Boolean);placed=Array(TOTAL).fill('');history=[];$('rosterScreen').classList.add('hide');$('work').classList.remove('hide');renderSeats();updateStatus()};
 // custom display labels after every render
 let rr=renderSeats;renderSeats=function(){rr();document.querySelectorAll('#seatGrid .desk').forEach((el,i)=>{if(placed[i]&&window.memberLabels?.[placed[i]])el.textContent=window.memberLabels[placed[i]]})};
})();

<script>
(function(){
 const $=id=>document.getElementById(id);
 // Visible tactile press even for taps that are too quick for :active.
 document.addEventListener('pointerdown',e=>{const b=e.target.closest('.btn,.numChip');if(b)b.classList.add('pressed')});
 document.addEventListener('pointerup',()=>document.querySelectorAll('.pressed').forEach(b=>setTimeout(()=>b.classList.remove('pressed'),70)));
 document.addEventListener('pointercancel',()=>document.querySelectorAll('.pressed').forEach(b=>b.classList.remove('pressed')));
 function flyToSeat(text,seatEl,delay){return new Promise(resolve=>setTimeout(()=>{
   const r=seatEl.getBoundingClientRect(), startX=Math.max(70,window.innerWidth*.10),startY=window.innerHeight*.42;
   const f=document.createElement('div');
   f.textContent=(window.memberLabels&&window.memberLabels[text])||text;
   f.style.cssText=`position:fixed;left:${startX}px;top:${startY}px;z-index:99999;font-weight:1000;font-size:54px;line-height:1;color:#fff;text-shadow:0 0 8px #60a5fa,0 0 18px #2563eb,0 0 32px #1d4ed8,0 5px 8px #0008;pointer-events:none;transform:translate(-50%,-50%) scale(1.8) rotate(-10deg);transition:left .34s cubic-bezier(.12,.88,.18,1),top .34s cubic-bezier(.12,.88,.18,1),transform .34s cubic-bezier(.12,.88,.18,1),opacity .10s .31s`;
   document.body.appendChild(f);
   requestAnimationFrame(()=>{
     f.style.left=`${r.left+r.width/2}px`;
     f.style.top=`${r.top+r.height/2}px`;
     f.style.transform=`translate(-50%,-50%) scale(.8) rotate(2deg)`;

<script>
(function(){
  const $=id=>document.getElementById(id);

  // ---- clear explanation of input/output mapping in member rows ----
  function syncLabels(){
    if(!window.memberLabels) window.memberLabels={};
  }

  // ---- swap mode ----
  let swapMode=false, swapFirst=-1;

  function refreshSwapUI(){
    const p=$('swapPanel'), h=$('swapHint');
    if(!p||!h)return;
    p.classList.toggle('active',swapMode);
    h.textContent = !swapMode ? '抽選後に2席を順番にタップ'
      : swapFirst<0 ? '1つ目の席をタップ'
      : '2つ目の席をタップ';
    document.querySelectorAll('#seatGrid .desk').forEach((d,i)=>{
      d.classList.toggle('swapPick',swapMode && i===swapFirst);
    });
  }

  const sm=$('swapMode');
  if(sm){
    sm.onclick=()=>{
      swapMode=!swapMode; swapFirst=-1; refreshSwapUI();
    };
  }

  document.addEventListener('click',e=>{
    if(!swapMode) return;
    const d=e.target.closest('#seatGrid .desk');
    if(!d) return;
    const desks=[...document.querySelectorAll('#seatGrid .desk')];
    const idx=desks.indexOf(d);
    if(idx<0 || !used[idx]) return;
    e.preventDefault(); e.stopPropagation();

    if(swapFirst<0){
      swapFirst=idx; refreshSwapUI(); return;
    }
    if(idx===swapFirst){ swapFirst=-1; refreshSwapUI(); return; }

    const before=placed.slice();
    [placed[swapFirst],placed[idx]]=[placed[idx],placed[swapFirst]];
    history.push({snapshot:before});
    swapMode=false; swapFirst=-1;
    renderSeats(); updateStatus(); refreshSwapUI();
    flashStatus('2席を入れ替えました','good');
  },true);

  // ---- single draw: animate the entered item to its selected seat ----
  const single=$('placeOne');
  if(single){
    const n=single.cloneNode(true); single.replaceWith(n);
    n.onclick=async()=>{
      let val=$('oneNum').value.trim();
      if(!val) return flashStatus('入力番号を入れてください。','bad');

      // resolve by entered ID only; names can still be typed if exact label matches
      let resolved=val;
      if(window.memberLabels){
        for(const [id,label] of Object.entries(window.memberLabels)){
          if(String(label).trim()===val) resolved=String(id);
        }
      }
      val=resolved;

      if(usedNums().has(String(val))) return flashStatus('その番号は入力済みです。','bad');
      if(!roster.map(String).includes(String(val))) return flashStatus('使用しない番号です。','bad');

      let compliant=[], fallback=[];
      for(let i=0;i<TOTAL;i++){
        if(used[i]&&target[i]&&!placed[i]){
          fallback.push(i);
          if(typeof violatesPair==='function' ? !violatesPair(val,i,placed) : true) compliant.push(i);
        }
      }
      let seats=compliant.length?compliant:fallback;
      if(!seats.length) return flashStatus('抽選対象の空席がありません。','bad');

      const idx=seats[Math.floor(Math.random()*seats.length)];
      const before=placed.slice();
      placed[idx]=String(val);
      history.push({snapshot:before});

      renderSeats();
      const el=document.querySelectorAll('#seatGrid .desk')[idx];
      if(typeof flyToSeat==='function') await flyToSeat(String(val),el,0);
      $('oneNum').value='';
      updateStatus();
    };
  }

  // ---- remaining all: fill every selected target seat, animate by ascending input number ----
  const auto=$('autoRest');
  if(auto){
    const n=auto.cloneNode(true); auto.replaceWith(n);
    n.onclick=async()=>{
      const taken=new Set(placed.filter(Boolean).map(String));
      let nums=roster.map(String).filter(x=>!taken.has(x));
      const seats=[];
      for(let i=0;i<TOTAL;i++) if(used[i]&&target[i]&&!placed[i]) seats.push(i);

      if(!seats.length) return flashStatus('抽選対象の空席がありません。','bad');
      if(nums.length<seats.length) return flashStatus(`残り ${nums.length}人 ／ 対象 ${seats.length}席`,'bad');

      // random seats, but animation/order is ascending by number where numeric
      for(let i=seats.length-1;i>0;i--){
        const j=Math.floor(Math.random()*(i+1));
        [seats[i],seats[j]]=[seats[j],seats[i]];
      }

      nums.sort((a,b)=>{
        const na=Number(a), nb=Number(b);
        const an=Number.isFinite(na), bn=Number.isFinite(nb);
        if(an&&bn) return na-nb;
        if(an) return -1;
        if(bn) return 1;
        return String(a).localeCompare(String(b),'ja');
      });
      nums=nums.slice(0,seats.length);

      // Try to improve pair constraint while keeping ascending animation.
      if(typeof pairValid==='function'){
        for(let attempt=0;attempt<300;attempt++){
          const test=placed.slice();
          nums.forEach((num,k)=>test[seats[k]]=num);
          if(pairValid(test)) break;
          for(let i=seats.length-1;i>0;i--){
            const j=Math.floor(Math.random()*(i+1));
            [seats[i],seats[j]]=[seats[j],seats[i]];
          }
        }
      }

      const before=placed.slice();
      history.push({snapshot:before});
      n.disabled=true;

      for(let k=0;k<nums.length;k++){
        placed[seats[k]]=nums[k];
        renderSeats();
        const el=document.querySelectorAll('#seatGrid .desk')[seats[k]];
        if(typeof flyToSeat==='function') await flyToSeat(nums[k],el,0);
      }
      n.disabled=false;
      updateStatus();
      flashStatus('残りをすべて配置しました！','good');
    };
  }

  // ---- A4 landscape monochrome export with input number + output name ----
  async function makeA4Canvas(){
    const W=3508, H=2480; // A4 landscape at 300 dpi
    const c=document.createElement('canvas'); c.width=W; c.height=H;
    const ctx=c.getContext('2d');
    ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#000'; ctx.textAlign='center';

    const title=($('layoutName')?.value||'席替え表').trim()||'席替え表';
    ctx.font='bold 84px sans-serif';
    ctx.fillText(title,W/2,110);

    ctx.strokeStyle='#000'; ctx.lineWidth=7;
    ctx.strokeRect(260,175,W-520,110);
    ctx.font='bold 50px sans-serif';
    ctx.fillText('黒　板',W/2,245);

    const left=220, top=350, right=220, bottom=190;
    const gridW=W-left-right, gridH=H-top-bottom;
    const cellW=gridW/COLS, cellH=gridH/ROWS;

    for(let r=0;r<ROWS;r++){
      for(let col=0;col<COLS;col++){
        const i=r*COLS+col;
        if(!used[i]) continue;
        const x=left+col*cellW+18, y=top+r*cellH+14;
        const w=cellW-36, h=cellH-28;
        ctx.strokeStyle='#000'; ctx.lineWidth=5;
        ctx.strokeRect(x,y,w,h);

        const id=placed[i] ? String(placed[i]) : '';
        const name=id ? (window.memberLabels?.[id]||id) : '';
        if(id){
          // number top, name larger underneath
          ctx.fillStyle='#000';
          ctx.textAlign='center';
          ctx.font='bold 40px sans-serif';
          ctx.fillText(`No.${id}`,x+w/2,y+55);
          ctx.font='bold 58px sans-serif';
          const max=name.length>7 ? name.slice(0,7) : name;
          ctx.fillText(max,x+w/2,y+h/2+35);
        }
      }
    }
    return c;
  }

  const save=$('savePng');
  if(save){
    const n=save.cloneNode(true); save.replaceWith(n);
    n.textContent='A4白黒画像';
    n.onclick=async()=>{
      const c=await makeA4Canvas();
      const a=document.createElement('a');
      a.download=(($('layoutName')?.value||'席替え表').trim()||'席替え表')+'_A4横.png';
      a.href=c.toDataURL('image/png');
      a.click();
      flashStatus('A4横・白黒画像を保存しました','good');
    };
  }

  const copy=$('copyImage');
  if(copy){
    const n=copy.cloneNode(true); copy.replaceWith(n);
    n.onclick=async()=>{
      try{
        const c=await makeA4Canvas();
        const blob=await new Promise(r=>c.toBlob(r,'image/png'));
        if(navigator.clipboard && window.ClipboardItem){
          await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);
          flashStatus('A4白黒画像をコピーしました','good');
        }else{
          flashStatus('このブラウザでは画像コピーに対応していません','bad');
        }
      }catch(e){ flashStatus('画像コピーに失敗しました','bad'); }
    };
  }

  syncLabels();
  refreshSwapUI();
})();
</script>


<script>
(function(){
  const $=id=>document.getElementById(id);
  let considerPairs = JSON.parse(localStorage.getItem('seatConsiderPairs') || '[]');

  function currentMembers(){
    // members is lexical in earlier script, so infer from roster + labels when possible.
    const arr=[];
    if(typeof roster!=='undefined' && Array.isArray(roster) && roster.length){
      roster.forEach(id=>arr.push({id:String(id),label:(window.memberLabels&&window.memberLabels[String(id)])||String(id)}));
    } else {
      // before entering work, read editable rows / chips
      const rows=[...document.querySelectorAll('#memberRows2 .memberRow')];
      if(rows.length){
        rows.forEach(r=>{
          const ins=r.querySelectorAll('input');
          if(ins.length>=2 && ins[0].value.trim()) arr.push({id:ins[0].value.trim(),label:ins[1].value.trim()||ins[0].value.trim()});
        });
      } else {
        document.querySelectorAll('#rosterNums2 .numChip').forEach((b,i)=>{
          const t=b.textContent.trim();
          if(t) arr.push({id:String(i+1),label:t});
        });
      }
    }
    return arr;
  }

  function normalizePair(p){
    return {a:String(p?.a||''),b:String(p?.b||'')};
  }

  function savePairs(){
    considerPairs=considerPairs.map(normalizePair).filter(p=>p.a&&p.b&&p.a!==p.b);
    localStorage.setItem('seatConsiderPairs',JSON.stringify(considerPairs));
  }

  function renderPairs(){
    const box=$('considerPairs');
    if(!box) return;
    const mem=currentMembers();
    box.innerHTML='';
    considerPairs.forEach((p,idx)=>{
      const row=document.createElement('div');
      row.className='considerPairRow';
      const a=document.createElement('select');
      const b=document.createElement('select');
      function fill(sel,val){
        sel.innerHTML='<option value="">選択</option>';
        mem.forEach(m=>{
          const o=document.createElement('option');
          o.value=m.id; o.textContent=`${m.id}：${m.label}`;
          if(String(m.id)===String(val)) o.selected=true;
          sel.appendChild(o);
        });
      }
      fill(a,p.a); fill(b,p.b);
      a.onchange=()=>{considerPairs[idx].a=a.value;savePairs()};
      b.onchange=()=>{considerPairs[idx].b=b.value;savePairs()};
      const sep=document.createElement('div'); sep.className='pairSep'; sep.textContent='×';
      const del=document.createElement('button'); del.textContent='×';
      del.onclick=()=>{considerPairs.splice(idx,1);savePairs();renderPairs()};
      row.append(a,sep,b,del); box.appendChild(row);
    });
    if(!considerPairs.length){
      const e=document.createElement('div');
      e.style.cssText='font-size:11px;color:#94a3b8;padding:4px 0';
      e.textContent='配慮設定なし';
      box.appendChild(e);
    }
  }

  const add=$('addConsiderPair');
  if(add) add.onclick=()=>{
    considerPairs.push({a:'',b:''});
    renderPairs();
  };

  // Refresh pair choices whenever roster/member UI is interacted with.
  document.addEventListener('click',e=>{
    if(e.target.closest('#rosterScreen')) setTimeout(renderPairs,0);
  });
  document.addEventListener('input',e=>{
    if(e.target.closest('#memberRows2')) setTimeout(renderPairs,0);
  });

  function isAdjacent2(a,b){
    if(a<0||b<0) return false;
    const ar=Math.floor(a/COLS), ac=a%COLS, br=Math.floor(b/COLS), bc=b%COLS;
    return Math.abs(ar-br)+Math.abs(ac-bc)===1;
  }

  function violatesAnyPair(num,seat,arr){
    const n=String(num);
    for(const p of considerPairs){
      if(!p.a||!p.b||p.a===p.b) continue;
      if(n!==String(p.a) && n!==String(p.b)) continue;
      const other=n===String(p.a)?String(p.b):String(p.a);
      const oi=arr.findIndex(x=>String(x)===other);
      if(oi>=0 && isAdjacent2(seat,oi)) return true;
    }
    return false;
  }

  function finalPairsValid(arr){
    for(const p of considerPairs){
      if(!p.a||!p.b||p.a===p.b) continue;
      const a=arr.findIndex(x=>String(x)===String(p.a));
      const b=arr.findIndex(x=>String(x)===String(p.b));
      if(a>=0&&b>=0&&isAdjacent2(a,b)) return false;
    }
    return true;
  }

  // Override single draw again for multi-pair support.
  const single=$('placeOne');
  if(single){
    const n=single.cloneNode(true); single.replaceWith(n);
    n.onclick=async()=>{
      let val=$('oneNum').value.trim();
      if(!val) return flashStatus('入力番号を入れてください。','bad');

      if(window.memberLabels){
        for(const [id,label] of Object.entries(window.memberLabels)){
          if(String(label).trim()===val) val=String(id);
        }
      }
      if(usedNums().has(String(val))) return flashStatus('その番号は入力済みです。','bad');
      if(!roster.map(String).includes(String(val))) return flashStatus('使用しない番号です。','bad');

      let preferred=[], fallback=[];
      for(let i=0;i<TOTAL;i++){
        if(used[i]&&target[i]&&!placed[i]){
          fallback.push(i);
          if(!violatesAnyPair(val,i,placed)) preferred.push(i);
        }
      }
      const seats=preferred.length?preferred:fallback;
      if(!seats.length) return flashStatus('抽選対象の空席がありません。','bad');

      const idx=seats[Math.floor(Math.random()*seats.length)];
      const before=placed.slice();
      placed[idx]=String(val);
      history.push({snapshot:before});
      renderSeats();
      const el=document.querySelectorAll('#seatGrid .desk')[idx];
      if(typeof flyToSeat==='function') await flyToSeat(String(val),el,0);
      $('oneNum').value='';
      updateStatus();
    };
  }

  // Override remaining all again for multi-pair support.
  const auto=$('autoRest');
  if(auto){
    const n=auto.cloneNode(true); auto.replaceWith(n);
    n.onclick=async()=>{
      const taken=new Set(placed.filter(Boolean).map(String));
      let nums=roster.map(String).filter(x=>!taken.has(x));
      const seats=[];
      for(let i=0;i<TOTAL;i++) if(used[i]&&target[i]&&!placed[i]) seats.push(i);

      if(!seats.length) return flashStatus('抽選対象の空席がありません。','bad');
      if(nums.length<seats.length) return flashStatus(`残り ${nums.length}人 ／ 対象 ${seats.length}席`,'bad');

      nums.sort((a,b)=>{
        const na=Number(a), nb=Number(b);
        const an=Number.isFinite(na), bn=Number.isFinite(nb);
        if(an&&bn) return na-nb;
        if(an) return -1;
        if(bn) return 1;
        return String(a).localeCompare(String(b),'ja');
      });
      nums=nums.slice(0,seats.length);

      let chosenSeats=null;
      for(let attempt=0;attempt<700;attempt++){
        const ss=seats.slice();
        for(let i=ss.length-1;i>0;i--){
          const j=Math.floor(Math.random()*(i+1));
          [ss[i],ss[j]]=[ss[j],ss[i]];
        }
        const test=placed.slice();
        nums.forEach((num,k)=>test[ss[k]]=num);
        if(finalPairsValid(test)){chosenSeats=ss;break;}
      }
      if(!chosenSeats){
        chosenSeats=seats.slice();
        for(let i=chosenSeats.length-1;i>0;i--){
          const j=Math.floor(Math.random()*(i+1));
          [chosenSeats[i],chosenSeats[j]]=[chosenSeats[j],chosenSeats[i]];
        }
      }

      const before=placed.slice();
      history.push({snapshot:before});
      n.disabled=true;
      for(let k=0;k<nums.length;k++){
        placed[chosenSeats[k]]=nums[k];
        renderSeats();
        const el=document.querySelectorAll('#seatGrid .desk')[chosenSeats[k]];
        if(typeof flyToSeat==='function') await flyToSeat(nums[k],el,0);
      }
      n.disabled=false;
      updateStatus();
      flashStatus('残りをすべて配置しました！','good');
    };
  }

  // Ensure pairs refresh when roster screen is first shown.
  setTimeout(renderPairs,0);
})();
</script>


<script>
(function(){
  const $=id=>document.getElementById(id);

  // ===== Persist member list =====
  const MEMBER_KEY='seatRosterMembersV1';
  const PAIR_KEY='seatConsiderPairsV2';

  function readSavedMembers(){
    try{
      const v=JSON.parse(localStorage.getItem(MEMBER_KEY)||'[]');
      return Array.isArray(v)?v:[];
    }catch(e){return []}
  }
  function saveCurrentMemberRows(){
    const rows=[...document.querySelectorAll('#memberRows2 .memberRow')];
    const data=rows.map(r=>{
      const ins=r.querySelectorAll('input');
      return {id:(ins[0]?.value||'').trim(),label:(ins[1]?.value||'').trim()};
    }).filter(x=>x.id);
    if(data.length) localStorage.setItem(MEMBER_KEY,JSON.stringify(data));
    return data;
  }

  function memberData(){
    const fromRows=saveCurrentMemberRows();
    if(fromRows.length) return fromRows;
    const saved=readSavedMembers();
    if(saved.length) return saved;
    return [];
  }

  // If saved names exist, restore them into editable rows after opening "変更する".
  document.addEventListener('click',e=>{
    if(e.target && e.target.id==='changeMembers2'){
      setTimeout(()=>{
        const saved=readSavedMembers();
        if(!saved.length) return;
        const rows=[...document.querySelectorAll('#memberRows2 .memberRow')];
        if(rows.length===saved.length){
          rows.forEach((r,i)=>{
            const ins=r.querySelectorAll('input');
            if(ins[0]) ins[0].value=saved[i].id;
            if(ins[1]) ins[1].value=saved[i].label;
          });
        }
        renderHiddenPairs();
      },30);
    }
  });

  document.addEventListener('input',e=>{
    if(e.target.closest && e.target.closest('#memberRows2')){
      saveCurrentMemberRows();
      setTimeout(renderHiddenPairs,0);
    }
  });
  document.addEventListener('change',e=>{
    if(e.target.closest && e.target.closest('#memberRows2')) saveCurrentMemberRows();
  });

  // ===== Hidden consideration settings inside name editor =====
  let pairs=[];
  try{pairs=JSON.parse(localStorage.getItem(PAIR_KEY)||'[]'); if(!Array.isArray(pairs))pairs=[]}catch(e){pairs=[]}

  function savePairs(){
    pairs=pairs.filter(p=>p && p.a && p.b && p.a!==p.b);
    localStorage.setItem(PAIR_KEY,JSON.stringify(pairs));
  }
  function renderHiddenPairs(){
    const box=$('considerPairs2'); if(!box) return;
    const mem=memberData();
    box.innerHTML='';
    if(!pairs.length){
      const t=document.createElement('div');
      t.style.cssText='font-size:10px;color:#94a3b8;margin:2px 0 5px';
      t.textContent='設定なし';
      box.appendChild(t);
    }
    pairs.forEach((p,i)=>{
      const row=document.createElement('div'); row.className='considerPairRow2';
      const a=document.createElement('select'), b=document.createElement('select');
      const fill=(sel,val)=>{
        sel.innerHTML='<option value="">選択</option>';
        mem.forEach(m=>{
          const o=document.createElement('option');
          o.value=m.id; o.textContent=(m.id+'：'+(m.label||m.id));
          if(String(val)===String(m.id))o.selected=true;
          sel.appendChild(o);
        });
      };
      fill(a,p.a); fill(b,p.b);
      a.onchange=()=>{pairs[i].a=a.value;savePairs()};
      b.onchange=()=>{pairs[i].b=b.value;savePairs()};
      const sep=document.createElement('span'); sep.textContent='×'; sep.style.textAlign='center';
      const del=document.createElement('button'); del.textContent='×';
      del.onclick=()=>{pairs.splice(i,1);savePairs();renderHiddenPairs()};
      row.append(a,sep,b,del); box.appendChild(row);
    });
  }

  if($('hiddenPrefBtn')) $('hiddenPrefBtn').onclick=()=>{
    const p=$('hiddenPrefPanel');
    p.style.display=p.style.display==='none'?'block':'none';
    renderHiddenPairs();
  };
  if($('addConsiderPair2')) $('addConsiderPair2').onclick=()=>{
    pairs.push({a:'',b:''}); renderHiddenPairs();
  };

  // ===== Helpers =====
  function adjacent(a,b){
    const ar=Math.floor(a/COLS),ac=a%COLS,br=Math.floor(b/COLS),bc=b%COLS;
    return Math.abs(ar-br)+Math.abs(ac-bc)===1;
  }
  function violatesAny(num,seat,arr){
    for(const p of pairs){
      if(!p.a||!p.b) continue;
      const n=String(num);
      if(n!==String(p.a)&&n!==String(p.b)) continue;
      const other=n===String(p.a)?String(p.b):String(p.a);
      const oi=arr.findIndex(x=>String(x)===other);
      if(oi>=0&&adjacent(seat,oi)) return true;
    }
    return false;
  }

  // ===== Restore labels before entering work =====
  const next=$('rosterNext2');
  if(next){
    const n=next.cloneNode(true); next.replaceWith(n);
    n.onclick=()=>{
      saveCurrentMemberRows();

      const rows=[...document.querySelectorAll('#memberRows2 .memberRow')];
      let selectedIDs=[];
      const chips=[...document.querySelectorAll('#rosterNums2 .numChip')];
      chips.forEach((c,i)=>{
        if(c.classList.contains('on') && rows[i]){
          const ins=rows[i].querySelectorAll('input');
          const id=(ins[0]?.value||'').trim();
          if(id) selectedIDs.push(id);
        }
      });

      // fallback to existing roster if editor is closed/not populated
      if(!selectedIDs.length && typeof roster!=='undefined') selectedIDs=roster.map(String);
      if(selectedIDs.length!==used.filter(Boolean).length) return;

      roster=selectedIDs;
      window.memberLabels={};
      const saved=readSavedMembers();
      saved.forEach(m=>window.memberLabels[String(m.id)]=m.label||m.id);
      rows.forEach(r=>{
        const ins=r.querySelectorAll('input');
        const id=(ins[0]?.value||'').trim(), label=(ins[1]?.value||'').trim();
        if(id) window.memberLabels[id]=label||id;
      });

      target=used.map(Boolean);
      placed=Array(TOTAL).fill('');
      history=[];
      $('rosterScreen').classList.add('hide');
      $('work').classList.remove('hide');
      renderSeats(); updateStatus();
    };
  }

  // ===== Seat-selection mode for one-number draw =====
  let pickMode=false;
  let pickedSeats=new Set();

  function paintPick(){
    document.querySelectorAll('#seatGrid .desk').forEach((d,i)=>{
      d.classList.toggle('drawSelected',pickedSeats.has(i));
    });
    if($('seatPickHint')){
      $('seatPickHint').textContent=pickedSeats.size
        ? `指定 ${pickedSeats.size}席から抽選`
        : (pickMode?'席をタップして選択':'未指定なら対象席からランダム');
    }
  }
  if($('seatPickMode')) $('seatPickMode').onclick=()=>{
    pickMode=!pickMode;
    $('seatPickMode').textContent=pickMode?'選択中':'席を指定';
    paintPick();
  };
  if($('clearSeatPick')) $('clearSeatPick').onclick=()=>{
    pickedSeats.clear(); pickMode=false; $('seatPickMode').textContent='席を指定'; paintPick();
  };

  document.addEventListener('click',e=>{
    if(!pickMode) return;
    const d=e.target.closest('#seatGrid .desk');
    if(!d) return;
    const all=[...document.querySelectorAll('#seatGrid .desk')];
    const i=all.indexOf(d);
    if(i<0||!used[i]||!target[i]||placed[i]) return;
    e.preventDefault(); e.stopPropagation();
    pickedSeats.has(i)?pickedSeats.delete(i):pickedSeats.add(i);
    paintPick();
  },true);

  // ===== Fix single-number draw reliably =====
  const draw=$('placeOne');
  if(draw){
    const n=draw.cloneNode(true); draw.replaceWith(n);
    n.onclick=async()=>{
      let val=($('oneNum')?.value||'').trim();
      if(!val) return flashStatus('入力番号を入れてください。','bad');

      // allow number or exact registered name
      if(window.memberLabels){
        for(const [id,label] of Object.entries(window.memberLabels)){
          if(String(label).trim()===val) val=String(id);
        }
      }
      if(usedNums().has(String(val))) return flashStatus('その番号は入力済みです。','bad');
      if(!roster.map(String).includes(String(val))) return flashStatus('使用しない番号です。','bad');

      let base=[];
      if(pickedSeats.size){
        base=[...pickedSeats].filter(i=>used[i]&&target[i]&&!placed[i]);
      }else{
        for(let i=0;i<TOTAL;i++) if(used[i]&&target[i]&&!placed[i]) base.push(i);
      }
      if(!base.length) return flashStatus('抽選できる席がありません。','bad');

      const preferred=base.filter(i=>!violatesAny(val,i,placed));
      const candidates=preferred.length?preferred:base;
      const idx=candidates[Math.floor(Math.random()*candidates.length)];

      const before=placed.slice();
      placed[idx]=String(val);
      history.push({snapshot:before});
      renderSeats();

      const el=document.querySelectorAll('#seatGrid .desk')[idx];
      if(typeof flyToSeat==='function') await flyToSeat(String(val),el,0);

      pickedSeats.delete(idx);
      $('oneNum').value='';
      updateStatus(); paintPick();
    };
  }

  // Keep pick highlight after seat rendering.
  const prevRender=renderSeats;
  renderSeats=function(){
    prevRender();
    // restore visible names
    document.querySelectorAll('#seatGrid .desk').forEach((el,i)=>{
      if(placed[i]&&window.memberLabels?.[String(placed[i])]) el.textContent=window.memberLabels[String(placed[i])];
    });
    paintPick();
  };

  renderHiddenPairs();
})();
</script>


<script>
(function(){
  function labelFor(id){
    const key=String(id);
    const name=window.memberLabels?.[key];
    return name && name!==key ? {main:name,sub:`No.${key}`} : {main:key,sub:''};
  }

  window.flyToSeat = function(text, seatEl, delay=0){
    return new Promise(resolve=>setTimeout(()=>{
      const info=labelFor(text);
      const r=seatEl.getBoundingClientRect();
      const cx=r.left+r.width/2, cy=r.top+r.height/2;

      const stage=document.createElement('div');
      stage.className='drawStage';
      const bg=document.createElement('div'); bg.className='backdrop';
      const hero=document.createElement('div'); hero.className='heroName'; hero.textContent=info.main;
      const sub=document.createElement('div'); sub.className='heroSub';
      sub.textContent=info.sub || '抽選中';
      stage.append(bg,hero,sub);
      document.body.appendChild(stage);

      // Large center reveal first so everyone can see whose turn it is.
      setTimeout(()=>{
        const flyer=document.createElement('div');
        flyer.className='flyNumber';
        flyer.textContent=info.main;
        document.body.appendChild(flyer);

        hero.style.opacity='0';
        sub.style.opacity='0';
        bg.animate([{opacity:1},{opacity:0}],{duration:220,fill:'forwards'});

        requestAnimationFrame(()=>{
          flyer.style.left=`${cx}px`;
          flyer.style.top=`${cy}px`;
          flyer.style.transform='translate(-50%,-50%) scale(.48) rotate(2deg)';
        });

        setTimeout(()=>{
          const flash=document.createElement('div');
          flash.className='impactFlash';
          flash.style.left=`${cx}px`; flash.style.top=`${cy}px`;
          document.body.appendChild(flash);
          flash.animate([
            {transform:'translate(-50%,-50%) scale(.15)',opacity:1},
            {transform:'translate(-50%,-50%) scale(1.6)',opacity:.95},
            {transform:'translate(-50%,-50%) scale(2.4)',opacity:0}
          ],{duration:400,easing:'ease-out'});

          for(let k=0;k<2;k++){
            const ring=document.createElement('div');
            ring.className='impactRing';
            ring.style.left=`${cx}px`; ring.style.top=`${cy}px`;
            document.body.appendChild(ring);
            ring.animate([
              {transform:'translate(-50%,-50%) scale(.15)',opacity:1},
              {transform:`translate(-50%,-50%) scale(${3.5+k*1.2})`,opacity:0}
            ],{duration:520+k*100,easing:'ease-out'});
            setTimeout(()=>ring.remove(),700);
          }

          seatEl.animate([
            {transform:'scale(1)'},
            {transform:'scale(1.22)'},
            {transform:'scale(.93)'},
            {transform:'scale(1.04)'},
            {transform:'scale(1)'}
          ],{duration:430,easing:'ease-out'});
          seatEl.animate([
            {filter:'brightness(1)'},
            {filter:'brightness(2.2)'},
            {filter:'brightness(1)'}
          ],{duration:480});

          flyer.style.opacity='0';
          setTimeout(()=>{
            flyer.remove(); stage.remove(); flash.remove(); resolve();
          },170);
        },430);
      },720);
    },delay));
  };
})();
</script>

<script>
(function(){
  const $=id=>document.getElementById(id);

  // ---------- compact 4-row left panel ----------
  const aside=document.querySelector('#work aside.panel');
  if(aside){
    const input=$('oneNum'), draw=$('placeOne'), auto=$('autoRest'),
          undo=$('undoBtn'), reset=$('clearPlaced'),
          saveApp=$('saveApp'), saveImg=$('savePng'),
          saveBox=aside.querySelector('.saveBox'),
          layoutName=$('layoutName');

    // Hide controls no longer needed.
    ['seatPickMode','clearSeatPick','selectAll','clearSelect','copyImage','printA4'].forEach(id=>{
      const el=$(id); if(el) el.style.display='none';
    });
    const hint=$('seatPickHint'); if(hint) hint.style.display='none';

    // Clear old layout wrappers; elements themselves are moved safely.
    const rows=[...aside.querySelectorAll(':scope > .row,:scope > .inputRow')];
    rows.forEach(r=>{ if(r.querySelector('#oneNum')||r.querySelector('#undoBtn')) r.remove(); });

    // Keep title first.
    const title=aside.querySelector('.title');
    const row1=document.createElement('div'); row1.className='row';
    row1.style.gridTemplateColumns='minmax(0,1fr) auto auto';
    row1.append(input,draw,auto);

    const row2=document.createElement('div'); row2.className='row';
    row2.append(undo,reset);

    const row3=document.createElement('div'); row3.className='row';
    row3.append(saveApp,saveImg);

    const openSaved=document.createElement('button');
    openSaved.className='btn gray smallBtn';
    openSaved.id='openSavedBrowser';
    openSaved.textContent='アプリ保存を開く';

    if(title){
      title.after(row1,row2,row3,openSaved);
    }else{
      aside.prepend(openSaved,row3,row2,row1);
    }

    // Keep name field compact just above save row.
    if(layoutName){
      layoutName.placeholder='保存名';
      layoutName.style.fontSize='13px';
      row3.before(layoutName);
    }

    // Hide old saveBox shell content if it became empty/noisy, but don't hide moved nodes.
    if(saveBox){
      const oldList=$('savedList'); if(oldList) oldList.style.display='none';
      saveBox.style.display='contents';
    }
  }

  // ---------- target seat controls at bottom of board ----------
  if($('boardSelectAll')) $('boardSelectAll').onclick=()=>{
    target=used.map((v,i)=>!!v && !placed[i]);
    renderSeats(); updateStatus();
  };
  if($('boardClearAll')) $('boardClearAll').onclick=()=>{
    target=used.map(()=>false);
    renderSeats(); updateStatus();
  };

  // Clicking a seat toggles target before it is occupied.
  document.addEventListener('click',e=>{
    const d=e.target.closest('#seatGrid .desk');
    if(!d) return;
    const list=[...document.querySelectorAll('#seatGrid .desk')];
    const i=list.indexOf(d);
    if(i<0||!used[i]||placed[i]) return;

    // do not intercept swap mode
    if(typeof swapMode!=='undefined' && swapMode) return;

    target[i]=!target[i];
    renderSeats(); updateStatus();
  });

  // ---------- saved seat browser ----------
  let selectedSavedIndex=-1;

  function getSavedLayoutsCompat(){
    try{
      if(typeof getLayouts==='function'){
        const x=getLayouts();
        if(Array.isArray(x)) return x;
      }
    }catch(e){}
    const keys=['seatLayouts','savedLayouts','seat_shuffle_layouts','seatShuffleLayouts'];
    for(const k of keys){
      try{
        const x=JSON.parse(localStorage.getItem(k)||'[]');
        if(Array.isArray(x)&&x.length) return x;
      }catch(e){}
    }
    return [];
  }

  function getSavedDate(item,index){
    const raw=item?.date||item?.savedAt||item?.createdAt||item?.time;
    if(raw){
      const d=new Date(raw);
      if(!isNaN(d)) return d.toLocaleString('ja-JP',{year:'numeric',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
    }
    return `保存 ${index+1}`;
  }

  function normalizeSaved(item){
    return {
      name:item?.name||item?.title||'名称なし',
      used:Array.isArray(item?.used)?item.used.slice():Array(TOTAL).fill(true),
      placed:Array.isArray(item?.placed)?item.placed.slice():Array(TOTAL).fill(''),
      target:Array.isArray(item?.target)?item.target.slice():null,
      roster:Array.isArray(item?.roster)?item.roster.slice():null,
      memberLabels:item?.memberLabels||item?.labels||{}
    };
  }

  function previewSaved(item){
    const data=normalizeSaved(item);
    $('savedPreviewTitle').textContent=data.name;
    const g=$('savedPreviewGrid'); g.innerHTML='';
    for(let i=0;i<TOTAL;i++){
      const d=document.createElement('div');
      d.className='desk '+(data.used[i]?'':'off');
      const id=data.placed[i] ? String(data.placed[i]) : '';
      d.textContent=id ? (data.memberLabels?.[id] || id) : '';
      g.appendChild(d);
    }
  }

  function openBrowser(){
    const arr=getSavedLayoutsCompat();
    const list=$('savedBrowserList'); list.innerHTML='';
    selectedSavedIndex=-1; $('savedUse').disabled=true;
    $('savedPreviewTitle').textContent='座席を選択';
    $('savedPreviewGrid').innerHTML='';

    if(!arr.length){
      list.innerHTML='<div style="font-size:12px;color:#64748b;padding:8px">保存された座席はありません。</div>';
    }else{
      arr.forEach((item,i)=>{
        const n=normalizeSaved(item);
        const b=document.createElement('button');
        b.className='savedItem';
        b.innerHTML=`<div class="savedItemName">${String(n.name).replace(/</g,'&lt;')}</div><div class="savedItemDate">${getSavedDate(item,i)}</div>`;
        b.onclick=()=>{
          selectedSavedIndex=i;
          document.querySelectorAll('.savedItem').forEach(x=>x.classList.remove('active'));
          b.classList.add('active');
          previewSaved(item);
          $('savedUse').disabled=false;
        };
        list.appendChild(b);
      });
    }
    $('savedOverlay').classList.add('show');
  }

  const open=$('openSavedBrowser');
  if(open) open.onclick=openBrowser;
  $('savedClose').onclick=()=>$('savedOverlay').classList.remove('show');
  $('savedUse').onclick=()=>{
    const arr=getSavedLayoutsCompat();
    if(selectedSavedIndex<0||!arr[selectedSavedIndex]) return;
    const d=normalizeSaved(arr[selectedSavedIndex]);
    used=d.used.slice();
    placed=d.placed.slice();
    target=d.target ? d.target.slice() : used.map((v,i)=>!!v&&!placed[i]);
    if(d.roster) roster=d.roster.slice();
    if(d.memberLabels) window.memberLabels={...d.memberLabels};
    $('savedOverlay').classList.remove('show');
    renderSeats(); updateStatus();
    flashStatus('保存した座席を開きました','good');
  };

  // ---------- ensure app save stores date, roster, labels ----------
  const saveBtn=$('saveApp');
  if(saveBtn){
    const n=saveBtn.cloneNode(true); saveBtn.replaceWith(n);
    n.onclick=()=>{
      const name=($('layoutName')?.value||'').trim();
      if(!name) return flashStatus('保存名を入力してください','bad');
      let arr=getSavedLayoutsCompat();
      const item={
        name,
        date:new Date().toISOString(),
        used:used.slice(),
        placed:placed.slice(),
        target:target.slice(),
        roster:(typeof roster!=='undefined'&&Array.isArray(roster))?roster.slice():[],
        memberLabels:{...(window.memberLabels||{})}
      };

      // determine compatible key; default to seatLayouts
      let key='seatLayouts';
      for(const k of ['seatLayouts','savedLayouts','seat_shuffle_layouts','seatShuffleLayouts']){
        try{
          const x=JSON.parse(localStorage.getItem(k)||'null');
          if(Array.isArray(x)){key=k;arr=x;break}
        }catch(e){}
      }
      arr.push(item);
      localStorage.setItem(key,JSON.stringify(arr));
      try{ if(typeof renderSavedList==='function') renderSavedList(); }catch(e){}
      flashStatus('アプリに保存しました','good');
    };
  }
})();
</script>


<script>
(function(){
  const $=id=>document.getElementById(id);

  function displayInfo(id){
    const key=String(id);
    const name=window.memberLabels?.[key];
    return {id:key,name:(name && String(name)!==key)?String(name):''};
  }

  // Replace flight animation: show ticket first, fly to exact desk center,
  // and only after impact should caller write the seat value.
  window.flyTicketToSeat=function(id,seatEl){
    return new Promise(resolve=>{
      const info=displayInfo(id);
      const r=seatEl.getBoundingClientRect();
      const cx=r.left+r.width/2, cy=r.top+r.height/2;

      const t=document.createElement('div');
      t.className='ticketFly';
      t.innerHTML=`${info.id}${info.name?`<span class="ticketSub">${info.name}</span>`:''}`;
      document.body.appendChild(t);

      setTimeout(()=>{
        t.style.left=`${cx}px`;
        t.style.top=`${cy}px`;
        t.style.transform='translate(-50%,-50%) scale(.52) rotate(1deg)';
      },560);

      setTimeout(()=>{
        seatEl.animate([
          {transform:'scale(1)'},
          {transform:'scale(1.18)'},
          {transform:'scale(.95)'},
          {transform:'scale(1)'}
        ],{duration:360,easing:'ease-out'});
        seatEl.animate([
          {boxShadow:'0 0 0 rgba(37,99,235,0)'},
          {boxShadow:'0 0 34px 12px rgba(37,99,235,.75)'},
          {boxShadow:'0 0 0 rgba(37,99,235,0)'}
        ],{duration:460});
        t.style.opacity='0';
        setTimeout(()=>{t.remove();resolve()},140);
      },1060);
    });
  };

  // Reliable single draw.
  const draw=$('placeOne');
  if(draw){
    const n=draw.cloneNode(true); draw.replaceWith(n);
    n.onclick=async()=>{
      let val=($('oneNum')?.value||'').trim();
      if(!val) return flashStatus('番号を入力してください。','bad');

      // exact registered name can also resolve to ID
      if(window.memberLabels){
        for(const [id,label] of Object.entries(window.memberLabels)){
          if(String(label).trim()===val) val=String(id);
        }
      }

      if(!Array.isArray(roster) || !roster.map(String).includes(String(val))){
        $('oneNum').value='';
        return flashStatus('使用しない番号です。','bad');
      }

      if(placed.some(x=>String(x)===String(val))){
        $('oneNum').value='';
        return flashStatus('この番号はすでに配置されています。','bad');
      }

      let seats=[];
      for(let i=0;i<TOTAL;i++){
        if(used[i] && target[i] && !placed[i]) seats.push(i);
      }
      if(!seats.length){
        $('oneNum').value='';
        return flashStatus('抽選対象の空席がありません。','bad');
      }

      // Apply consideration preference if possible.
      if(typeof violatesAny==='function'){
        const preferred=seats.filter(i=>!violatesAny(val,i,placed));
        if(preferred.length) seats=preferred;
      }

      const idx=seats[Math.floor(Math.random()*seats.length)];
      const before=placed.slice();
      history.push({snapshot:before});

      // Clear input immediately after the draw starts.
      $('oneNum').value='';

      // Crucial: do NOT change the desk before animation arrives.
      const el=document.querySelectorAll('#seatGrid .desk')[idx];
      n.disabled=true;
      await window.flyTicketToSeat(String(val),el);

      // Commit seat only after impact.
      placed[idx]=String(val);
      renderSeats();
      updateStatus();
      n.disabled=false;
    };
  }

  // Remaining-all draw: animate ticket first, then commit each seat.
  const auto=$('autoRest');
  if(auto){
    const n=auto.cloneNode(true); auto.replaceWith(n);
    n.onclick=async()=>{
      const taken=new Set(placed.filter(Boolean).map(String));
      let nums=roster.map(String).filter(x=>!taken.has(String(x)));

      const seats=[];
      for(let i=0;i<TOTAL;i++){
        if(used[i] && target[i] && !placed[i]) seats.push(i);
      }

      if(!seats.length) return flashStatus('抽選対象の空席がありません。','bad');
      if(nums.length<seats.length) return flashStatus(`残り ${nums.length}人 ／ 対象 ${seats.length}席`,'bad');

      nums.sort((a,b)=>{
        const na=Number(a), nb=Number(b);
        const an=Number.isFinite(na), bn=Number.isFinite(nb);
        if(an&&bn) return na-nb;
        if(an) return -1;
        if(bn) return 1;
        return String(a).localeCompare(String(b),'ja');
      });
      nums=nums.slice(0,seats.length);

      // randomize destinations
      for(let i=seats.length-1;i>0;i--){
        const j=Math.floor(Math.random()*(i+1));
        [seats[i],seats[j]]=[seats[j],seats[i]];
      }

      const before=placed.slice();
      history.push({snapshot:before});
      n.disabled=true;

      for(let k=0;k<nums.length;k++){
        const idx=seats[k];
        const el=document.querySelectorAll('#seatGrid .desk')[idx];

        // Again: animation first, commit second.
        await window.flyTicketToSeat(nums[k],el);
        placed[idx]=nums[k];
        renderSeats();
      }

      updateStatus();
      n.disabled=false;
      flashStatus('残りをすべて配置しました！','good');
    };
  }

  // Enter key should trigger the new button after cloning.
  const input=$('oneNum');
  if(input){
    input.onkeydown=e=>{
      if(e.key==='Enter'){
        e.preventDefault();
        $('placeOne')?.click();
      }
    };
  }
})();
</script>

<script>
(function(){
  const $=id=>document.getElementById(id);

  // Remove obsolete controls from the left panel.
  ['seatPickMode','clearSeatPick','swapMode','selectAll','clearSelect'].forEach(id=>{
    const el=$(id);
    if(el){
      const parent=el.parentElement;
      el.remove();
      if(parent && parent.classList.contains('row') && !parent.children.length) parent.remove();
    }
  });
  const hint=$('seatPickHint'); if(hint) hint.remove();
  const swapPanel=$('swapPanel'); if(swapPanel) swapPanel.remove();

  // Persist selected classroom desks after leaving the setup screen.
  const DESK_KEY='seatUsedDesksV1';
  const MEMBER_KEY='seatRosterMembersV1';

  function saveUsedDesks(){
    try{ localStorage.setItem(DESK_KEY, JSON.stringify(used.map(Boolean))); }catch(e){}
  }
  function restoreUsedDesks(){
    try{
      const v=JSON.parse(localStorage.getItem(DESK_KEY)||'null');
      if(Array.isArray(v) && v.length===TOTAL){
        used=v.map(Boolean);
        renderSetup();
        const pill=$('pill');
        if(pill) pill.textContent=`使用席 ${used.filter(Boolean).length} / ${TOTAL}`;
      }
    }catch(e){}
  }

  // Save desks whenever the first Next button is pressed.
  const go=$('goWork');
  if(go){
    go.addEventListener('click',()=>{ if(used.filter(Boolean).length) saveUsedDesks(); }, true);
  }

  // Save member IDs + labels whenever proceeding from roster screen.
  const rosterNext=$('rosterNext2');
  if(rosterNext){
    rosterNext.addEventListener('click',()=>{
      const rows=[...document.querySelectorAll('#memberRows2 .memberRow')];
      const data=rows.map(r=>{
        const ins=r.querySelectorAll('input');
        return {id:(ins[0]?.value||'').trim(),label:(ins[1]?.value||'').trim()};
      }).filter(x=>x.id);
      if(data.length){
        try{localStorage.setItem(MEMBER_KEY,JSON.stringify(data))}catch(e){}
      }
    },true);
  }

  // Also restore the saved classroom desks on launch.
  setTimeout(restoreUsedDesks,0);

  // Tap an occupied desk, then tap another occupied desk to swap.
  let swapSource=-1;

  function paintSwapSource(){
    document.querySelectorAll('#seatGrid .desk').forEach((d,i)=>{
      d.classList.toggle('swapSource',i===swapSource);
    });
  }

  document.addEventListener('click',e=>{
    const d=e.target.closest('#seatGrid .desk');
    if(!d) return;

    const desks=[...document.querySelectorAll('#seatGrid .desk')];
    const idx=desks.indexOf(d);
    if(idx<0 || !used[idx]) return;

    // Occupied-seat interactions are reserved for swapping and
    // should not toggle the draw target.
    if(placed[idx]){
      e.preventDefault();
      e.stopImmediatePropagation();

      if(swapSource<0){
        swapSource=idx;
        paintSwapSource();
        flashStatus('入れ替えるもう1つの席をタップ','good');
        return;
      }

      if(idx===swapSource){
        swapSource=-1;
        paintSwapSource();
        return;
      }

      const before=placed.slice();
      [placed[swapSource],placed[idx]]=[placed[idx],placed[swapSource]];
      history.push({snapshot:before});
      swapSource=-1;
      renderSeats();
      paintSwapSource();
      updateStatus();
      flashStatus('席を入れ替えました','good');
      return;
    }

    // If an empty desk is tapped while a source is selected, cancel swap.
    if(swapSource>=0){
      swapSource=-1;
      paintSwapSource();
    }
  }, true);

  // Keep selection frame after rerender.
  const rr=renderSeats;
  renderSeats=function(){
    rr();
    paintSwapSource();
  };
})();
</script>

<script>
(function(){
  function showNameOnly(id){
    const key=String(id);
    const label=window.memberLabels?.[key];
    return (label && String(label).trim()) ? String(label).trim() : key;
  }

  window.flyTicketToSeat = function(id,seatEl){
    return new Promise(resolve=>{
      const name=showNameOnly(id);
      const r=seatEl.getBoundingClientRect();
      const cx=r.left+r.width/2;
      const cy=r.top+r.height/2;

      // First, clearly show who is about to be placed.
      const reveal=document.createElement('div');
      reveal.className='nameReveal';
      reveal.textContent=name;
      document.body.appendChild(reveal);

      setTimeout(()=>{
        reveal.style.opacity='0';

        // Pure text flies to the seat — no card/background.
        const fly=document.createElement('div');
        fly.className='nameFly';
        fly.textContent=name;
        document.body.appendChild(fly);

        requestAnimationFrame(()=>{
          fly.style.left=`${cx}px`;
          fly.style.top=`${cy}px`;
          fly.style.transform='translate(-50%,-50%) scale(.38) rotate(1deg)';
        });

        setTimeout(()=>{
          // Bright impact core.
          const core=document.createElement('div');
          core.className='impactCore';
          core.style.left=`${cx}px`;
          core.style.top=`${cy}px`;
          document.body.appendChild(core);
          core.animate([
            {transform:'translate(-50%,-50%) scale(.15)',opacity:1},
            {transform:'translate(-50%,-50%) scale(1.7)',opacity:1},
            {transform:'translate(-50%,-50%) scale(3.0)',opacity:0}
          ],{duration:430,easing:'ease-out'});

          // Multiple shockwave rings.
          for(let i=0;i<3;i++){
            const wave=document.createElement('div');
            wave.className='impactWave';
            wave.style.left=`${cx}px`;
            wave.style.top=`${cy}px`;
            document.body.appendChild(wave);
            wave.animate([
              {transform:'translate(-50%,-50%) scale(.15)',opacity:1},
              {transform:`translate(-50%,-50%) scale(${3.2+i*1.35})`,opacity:0}
            ],{
              duration:520+i*90,
              delay:i*45,
              easing:'ease-out'
            });
            setTimeout(()=>wave.remove(),800);
          }

          // Radial rays for a stronger, game-like hit.
          for(let i=0;i<10;i++){
            const ray=document.createElement('div');
            ray.className='impactRay';
            ray.style.left=`${cx}px`;
            ray.style.top=`${cy}px`;
            ray.style.transform=`rotate(${i*36}deg)`;
            document.body.appendChild(ray);
            ray.animate([
              {opacity:0,transform:`rotate(${i*36}deg) scaleX(.2)`},
              {opacity:1,transform:`rotate(${i*36}deg) scaleX(1.15)`},
              {opacity:0,transform:`rotate(${i*36}deg) scaleX(1.7)`}
            ],{duration:420,easing:'ease-out'});
            setTimeout(()=>ray.remove(),520);
          }

          // Desk punch/flash.
          seatEl.animate([
            {transform:'scale(1)'},
            {transform:'scale(1.24)'},
            {transform:'scale(.92)'},
            {transform:'scale(1.06)'},
            {transform:'scale(1)'}
          ],{duration:460,easing:'ease-out'});
          seatEl.animate([
            {filter:'brightness(1)'},
            {filter:'brightness(2.4)'},
            {filter:'brightness(1)'}
          ],{duration:500});
          seatEl.animate([
            {boxShadow:'0 0 0 rgba(37,99,235,0)'},
            {boxShadow:'0 0 44px 18px rgba(37,99,235,.9)'},
            {boxShadow:'0 0 0 rgba(37,99,235,0)'}
          ],{duration:520});

          fly.style.opacity='0';

          setTimeout(()=>{
            reveal.remove();
            fly.remove();
            core.remove();
            resolve();
          },180);
        },450);
      },650);
    });
  };

  // Also make the older animation alias use the same effect.
  window.flyToSeat = function(id,seatEl){
    return window.flyTicketToSeat(id,seatEl);
  };
})();
</script>


<script>

  function saveCurrent(){

    if(!name || !name.trim()) return;

    const list=readAll();

  }

  // Hook whichever app-save button exists in the current rebuilt layout.
  ['saveAppV101','saveAppV10','saveApp'].forEach(id=>{
    const old=$(id);
    if(!old) return;
    const n=old.cloneNode(true);
    old.replaceWith(n);
    n.addEventListener('click',saveCurrent);
  });

  function drawPreview(item){
    const grid=$('savedPreviewGrid');
    const title=$('savedPreviewTitle');
    if(!grid||!title) return;

    title.textContent=item.name||'保存した座席';
    grid.innerHTML='';

    for(let i=0;i<TOTAL;i++){
      const d=document.createElement('div');
      d.className='desk '+(item.used?.[i]?'':'off');
      const id=item.placed?.[i] ? String(item.placed[i]) : '';
      d.textContent=id ? (item.memberLabels?.[id]||id) : '';
      grid.appendChild(d);
    }
  }

  function openSaved(){
    const list=readAll();
    const overlay=$('savedOverlay');
    const box=$('savedBrowserList');
    const use=$('savedUse');
    const close=$('savedClose');
    const preview=$('savedPreviewGrid');
    const title=$('savedPreviewTitle');

    if(!overlay||!box||!use||!close||!preview||!title) return;

    box.innerHTML='';
    preview.innerHTML='';
    title.textContent='座席を選択';
    use.disabled=true;

    let selected=-1;

    if(!list.length){
      box.innerHTML='<div style="padding:8px;font-size:12px;color:#64748b">保存した座席はありません。</div>';
    }else{
      list.slice().reverse().forEach((item,revIndex)=>{
        const realIndex=list.length-1-revIndex;
        const b=document.createElement('button');
        b.className='savedItem';

        const d=new Date(item.savedAt);
        const dt=isNaN(d)?'':d.toLocaleString('ja-JP',{
          year:'numeric',month:'numeric',day:'numeric',
          hour:'2-digit',minute:'2-digit'

        b.innerHTML=
          `<div class="savedItemName">${String(item.name||'名称なし').replace(/</g,'&lt;')}</div>`+
          `<div class="savedItemDate">${dt}</div>`;

        b.addEventListener('click',()=>{
          selected=realIndex;
          [...box.querySelectorAll('.savedItem')].forEach(x=>x.classList.remove('active'));
          b.classList.add('active');
          drawPreview(item);
          use.disabled=false;
        });

        box.appendChild(b);
      });
